<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sorting Methods Practice Tests</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:#f5f5f5;color:#1a1a1a;min-height:100vh;display:flex;flex-direction:column}

#main-col{flex:1;padding:1.5rem;overflow-y:auto}
.container{max-width:800px;margin:0 auto;width:100%}

#top-bar{display:flex;gap:10px;margin-bottom:1.5rem;align-items:center}
.hint-btn{padding:.6rem 1.2rem;border-radius:8px;border:1px solid #d1d5db;background:#fff;color:#1a1a1a;font-size:14px;cursor:pointer;font-weight:600;transition:background .15s}
.hint-btn:hover:not(:disabled){background:#fff3cd;border-color:#ffc107}
.hint-btn:disabled{opacity:.35}
.hint-popup{position:fixed;top:60px;left:20px;background:#ffc107;border:2px solid #ff9800;border-radius:8px;padding:1rem;max-width:300px;box-shadow:0 4px 12px rgba(0,0,0,.2);z-index:1000;animation:slideIn .3s ease}
@keyframes slideIn{from{transform:translateY(-20px);opacity:0}to{transform:translateY(0);opacity:1}}
.hint-close{position:absolute;top:5px;right:8px;font-size:18px;cursor:pointer}

#annot-toggle{position:fixed;top:15px;right:20px;z-index:1001;padding:8px 16px;border-radius:20px;border:1px solid #d1d5db;background:#fff;color:#1a1a1a;font-size:13px;cursor:pointer;font-weight:600;box-shadow:0 2px 8px rgba(0,0,0,0.1);transition:all .2s}
#annot-toggle:hover{background:#f3f4f6}
#annot-toggle.off{background:#e5e5e5;color:#666}

h1{font-size:20px;font-weight:600;margin-bottom:4px}
.subtitle{font-size:14px;color:#666;margin-bottom:1.5rem}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:1.25rem}
.stat{background:#fff;border-radius:10px;padding:.75rem 1rem;text-align:center;border:1px solid #e5e5e5}
.stat-label{font-size:11px;color:#888;margin-bottom:4px;text-transform:uppercase}
.stat-val{font-size:22px;font-weight:600}
.stat-val.green{color:#16a34a}
.stat-val.red{color:#dc2626}
.progress-bar{height:6px;background:#e5e5e5;border-radius:3px;margin-bottom:1.25rem;overflow:hidden}
.progress-fill{height:100%;background:#2563eb;transition:width .4s ease}
.card{background:#fff;border:1px solid #e5e5e5;border-radius:12px;padding:1.25rem 1.5rem;margin-bottom:1rem;position:relative;z-index:10}
.q-meta{font-size:12px;color:#999;margin-bottom:.75rem;display:flex;justify-content:space-between}
.topic-badge{background:#eff6ff;color:#1d4ed8;padding:2px 10px;border-radius:20px;font-size:11px;font-weight:500}
.q-text{font-size:15px;line-height:1.6;margin-bottom:1.25rem;font-weight:500}
.choices{display:flex;flex-direction:column;gap:8px}
.choice{display:flex;align-items:flex-start;gap:10px;padding:.7rem 1rem;border:1px solid #e5e5e5;border-radius:8px;cursor:pointer;font-size:14px;transition:background .15s;background:#fff;text-align:left;width:100%;position:relative;z-index:10}
.choice:hover:not(.locked){background:#f8f8f8}
.choice.correct-ans{border-color:#16a34a!important;background:#f0fdf4!important}
.choice.wrong-ans{border-color:#dc2626!important;background:#fef2f2!important}
.choice-letter{font-weight:600;min-width:20px;color:#888}
.explanation{margin-top:1rem;padding:.9rem 1.1rem;border-radius:8px;font-size:14px;display:none}
.explanation.wrong-exp{background:#fef2f2;border-left:3px solid #dc2626;color:#991b1b}
.explanation.correct-exp{background:#f0fdf4;border-left:3px solid #16a34a;color:#166534}
.explanation.show{display:block}
.exp-title{font-weight:600;margin-bottom:4px;font-size:13px}
.actions{display:flex;gap:10px;margin-top:1rem;flex-wrap:wrap}
button{padding:.55rem 1.1rem;border-radius:8px;border:1px solid #d1d5db;background:#fff;color:#1a1a1a;font-size:14px;cursor:pointer;position:relative;z-index:10}
button:hover:not(:disabled){background:#f3f4f6}
button.primary{background:#1a1a1a;color:#fff;border-color:#1a1a1a}
button.primary:hover:not(:disabled){opacity:.85}
button:disabled{opacity:.35}
button.dbtn{border-color:#dc2626;color:#dc2626}
button.dbtn:hover{background:#fef2f2}
.rw{text-align:center;padding:2rem 1rem;position:relative;z-index:10}
.rscore{font-size:64px;font-weight:700;line-height:1;margin-bottom:.4rem}
.rlabel{font-size:15px;color:#666;margin-bottom:.5rem}
.rgrade{font-size:20px;font-weight:600;margin-bottom:2rem}
.test-selector{display:flex;gap:8px;flex-wrap:wrap}
.test-btn{padding:.4rem .9rem;border-radius:20px;border:1px solid #d1d5db;background:#fff;font-size:13px;cursor:pointer;position:relative;z-index:10}
.test-btn:hover{background:#f3f4f6}
.test-btn.active{background:#1a1a1a;color:#fff}
.filter-row{display:flex;align-items:center;gap:12px;margin-bottom:1.25rem;flex-wrap:wrap}
.filter-row label{font-size:13px;color:#555;font-weight:500}
select{padding:.4rem .7rem;border-radius:8px;border:1px solid #d1d5db;background:#fff;color:#1a1a1a;font-size:13px;position:relative;z-index:10}
.sbw{margin-top:1rem}
.sbw button{width:100%;padding:.9rem}

#canvas-container{position:fixed;bottom:70px;top:0;left:0;right:0;pointer-events:none}
#canvas-container.off{display:none}
#annot-canvas{width:100%;height:100%;display:block;cursor:crosshair;pointer-events:auto}

#annot-toolbar{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #e5e5e5;padding:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;max-height:70px;overflow-y:auto;z-index:999}
#annot-toolbar.off{display:none}
.tool-btn{padding:6px 11px;border-radius:6px;border:1px solid #d1d5db;background:#fff;color:#1a1a1a;font-size:12px;cursor:pointer;display:flex;gap:4px;white-space:nowrap}
.tool-btn:hover{background:#f3f4f6}
.tool-btn.active{background:#1a1a1a;color:#fff;border-color:#1a1a1a}
.color-row{display:flex;gap:5px;align-items:center}
.cswatch{width:18px;height:18px;border-radius:50%;cursor:pointer;border:2px solid transparent;flex-shrink:0}
.cswatch.active{border-color:#1a1a1a}
.size-row{display:flex;align-items:center;gap:6px;font-size:12px}
#stroke-size{flex:1;min-width:80px}
.ann-btns{display:flex;gap:5px;margin-left:auto}
.ann-btns button{padding:4px 8px;font-size:11px}

#main-col{margin-bottom:70px}
#main-col.annot-off{margin-bottom:0}

.rstats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:1.5rem}
.ri{background:#fff;border:1px solid #e5e5e5;border-radius:12px;padding:1.1rem;margin-bottom:12px}
.rq{font-size:14px;font-weight:500;margin-bottom:.75rem}
.ra{font-size:13px;padding:.5rem;border-radius:6px;margin-bottom:6px}
.ra.wrong{background:#fef2f2;color:#991b1b}
.ra.correct{background:#f0fdf4;color:#166534}
.re{font-size:13px;padding:.5rem;border-radius:6px;background:#f8f8f8}
.divider{height:1px;background:#e5e5e5;margin:1.5rem 0}
@media(max-width:600px){.stats{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>

<div id="canvas-container"><canvas id="annot-canvas"></canvas></div>

<div id="main-col"><div class="container">

<div id="top-bar">
  <button class="hint-btn" id="hint-btn" onclick="showHint()" disabled>💡 Hint</button>
</div>

<div id="view-start">
  <h1>Sorting Methods Practice Tests</h1>
  <p class="subtitle">Master sorting algorithms — 250 questions, 5 tests, 50 per test</p>
  <div class="test-selector" id="test-selector"></div>
  <div class="filter-row">
    <label>Topic:</label>
    <select id="topic-filter"><option value="all">All topics</option></select>
  </div>
  <div class="sbw"><button class="primary" onclick="startTest()">Start Test</button></div>
</div>

<div id="view-test" style="display:none">
  <div class="stats">
    <div class="stat"><div class="stat-label">Question</div><div class="stat-val" id="s-cur">1</div></div>
    <div class="stat"><div class="stat-label">Correct</div><div class="stat-val green" id="s-cor">0</div></div>
    <div class="stat"><div class="stat-label">Wrong</div><div class="stat-val red" id="s-wrg">0</div></div>
    <div class="stat"><div class="stat-label">Score</div><div class="stat-val" id="s-pct">--</div></div>
  </div>
  <div class="progress-bar"><div class="progress-fill" id="prog"></div></div>
  <div class="card">
    <div class="q-meta"><span id="q-num"></span><span class="topic-badge" id="q-topic"></span></div>
    <div class="q-text" id="q-text"></div>
    <div class="choices" id="choices"></div>
    <div class="explanation" id="explanation"><span class="exp-title" id="exp-icon"></span><span id="exp-text"></span></div>
  </div>
  <div class="actions">
    <button onclick="goBack()" id="btn-back" disabled>Back</button>
    <button class="primary" onclick="nextQ()" id="btn-next" disabled>Next</button>
    <button class="dbtn" onclick="finishEarly()" style="margin-left:auto">Finish</button>
  </div>
</div>

<div id="view-results" style="display:none">
  <div class="rw"><div class="rscore" id="r-score"></div><div class="rlabel" id="r-label"></div><div class="rgrade" id="r-grade"></div>
  <div class="rstats"><div class="stat"><div class="stat-label">Correct</div><div class="stat-val green" id="r-cor"></div></div><div class="stat"><div class="stat-label">Wrong</div><div class="stat-val red" id="r-wrg"></div></div><div class="stat"><div class="stat-label">Skipped</div><div class="stat-val" id="r-skp"></div></div><div class="stat"><div class="stat-label">Total</div><div class="stat-val" id="r-tot"></div></div></div>
  <div style="display:flex;gap:10px;justify-content:center"><button class="primary" onclick="reviewWrong()">Review Wrong</button><button onclick="showStart()">New Test</button></div>
  <div id="review-section" style="display:none;margin-top:1rem"><div class="divider"></div><div id="review-title"></div><div id="review-list"></div></div>
</div>

</div></div>

<button id="annot-toggle" onclick="toggleAnnotations()">📝 Annotations: ON</button>

<div id="annot-toolbar">
  <button class="tool-btn active" onclick="setTool('select')">✓ Select</button>
  <button class="tool-btn" onclick="setTool('pen')">✏️ Draw</button>
  <button class="tool-btn" onclick="setTool('line')">📏 Line</button>
  <button class="tool-btn" onclick="setTool('rect')">▭ Box</button>
  <button class="tool-btn" onclick="setTool('circle')">⊙ Circle</button>
  <button class="tool-btn" onclick="setTool('highlight')">🎨 Highlight</button>
  <div class="color-row" style="margin-left:10px;border-left:1px solid #e5e5e5;padding-left:10px">
    <span>Color:</span>
    <div class="cswatch active" data-c="#1a1a1a" style="background:#1a1a1a" onclick="setColor(this)"></div>
    <div class="cswatch" data-c="#dc2626" style="background:#dc2626" onclick="setColor(this)"></div>
    <div class="cswatch" data-c="#2563eb" style="background:#2563eb" onclick="setColor(this)"></div>
    <div class="cswatch" data-c="#16a34a" style="background:#16a34a" onclick="setColor(this)"></div>
  </div>
  <div class="size-row" style="margin-left:10px;border-left:1px solid #e5e5e5;padding-left:10px">
    <span>Size:</span>
    <input type="range" id="stroke-size" min="1" max="20" value="2" oninput="strokeW=+this.value;document.getElementById('sv').textContent=this.value">
    <span id="sv">2</span>px
  </div>
  <div class="ann-btns">
    <button onclick="undoLast()">Undo</button>
    <button onclick="clearCanvas()">Clear</button>
  </div>
</div>

<script>
var ALL_QUESTIONS = [{"t": 1, "topic": "Bubble Sort", "q": "In Bubble Sort, what is the first step?", "c": ["Find the smallest item", "Compare the first two items", "Divide the list in half", "Pick a pivot"], "a": 1, "e": "Bubble Sort starts by comparing the first two items in the list.", "hint": "Think about comparing adjacent elements."}, {"t": 1, "topic": "Bubble Sort", "q": "What happens if the first item is bigger than the second in Bubble Sort?", "c": ["Delete the first item", "Swap them", "Keep them in the same order", "Move to the next pair"], "a": 1, "e": "If the first item is larger, we swap their positions.", "hint": "The word 'Bubble' hints at movement."}, {"t": 1, "topic": "Bubble Sort", "q": "Why is it called 'Bubble' Sort?", "c": ["It uses water analogy", "The largest items 'bubble up' to the end", "It sorts in bubbles", "It's fast"], "a": 1, "e": "The largest items gradually 'bubble' to their correct position at the end of the list.", "hint": "What moves to the surface in bubbles?"}, {"t": 1, "topic": "Bubble Sort", "q": "How many passes does Bubble Sort need for a 4-item list?", "c": ["1", "2", "3", "4"], "a": 2, "e": "For a list of n items, Bubble Sort needs n-1 passes. For 4 items: 3 passes.", "hint": "It's one less than the number of items."}, {"t": 1, "topic": "Bubble Sort", "q": "Bubble Sort [3, 1, 2]. After the first pass, the list is:", "c": ["[1, 3, 2]", "[1, 2, 3]", "[3, 1, 2]", "[2, 1, 3]"], "a": 0, "e": "Compare 3&1 (swap), compare 3&2 (swap), giving [1, 2, 3]. The largest (3) is now at the end.", "hint": "The largest item ends up at the end after one pass."}, {"t": 1, "topic": "Bubble Sort", "q": "Is Bubble Sort used in modern programming?", "c": ["Yes, it's the fastest", "Yes, it's most common", "No, it's too slow", "Only for websites"], "a": 2, "e": "Bubble Sort is too inefficient for real applications. It's mainly used for teaching.", "hint": "Think about what programmers use."}, {"t": 1, "topic": "Bubble Sort", "q": "What is the worst-case time complexity of Bubble Sort?", "c": ["O(n)", "O(n log n)", "O(n\u00b2)", "O(1)"], "a": 2, "e": "Bubble Sort has O(n\u00b2) complexity in the worst case because it compares all pairs multiple times.", "hint": "It's related to n times n comparisons."}, {"t": 1, "topic": "Bubble Sort", "q": "How many comparisons does Bubble Sort make on a 5-item list?", "c": ["5", "10", "15", "20"], "a": 1, "e": "For n items, Bubble Sort makes roughly n(n-1)/2 comparisons. For 5 items: 10 comparisons.", "hint": "Count comparisons per pass."}, {"t": 1, "topic": "Bubble Sort", "q": "Is Bubble Sort stable?", "c": ["No, it's unstable", "Yes, it's stable", "Only sometimes", "Depends on data"], "a": 1, "e": "Bubble Sort is stable because equal elements maintain their original order.", "hint": "Does swapping equal elements change their order?"}, {"t": 1, "topic": "Bubble Sort", "q": "What is the best-case time complexity of Bubble Sort?", "c": ["O(n\u00b2)", "O(n)", "O(log n)", "O(1)"], "a": 1, "e": "Best case is O(n) if the list is already sorted (no swaps needed).", "hint": "When is no work needed?"}, {"t": 1, "topic": "Selection Sort", "q": "In Selection Sort, what do you find first?", "c": ["The largest item", "The smallest item", "The middle item", "Any random item"], "a": 1, "e": "Selection Sort finds the smallest item in the unsorted portion and places it first.", "hint": "The name suggests selecting something."}, {"t": 1, "topic": "Selection Sort", "q": "How does Selection Sort place items?", "c": ["Randomly", "In the correct sorted position", "At the end of the list", "Alphabetically"], "a": 1, "e": "Selection Sort places the smallest found item in the correct position from left to right.", "hint": "It builds the sorted portion from left."}, {"t": 1, "topic": "Selection Sort", "q": "Selection Sort [4, 2, 6, 1]. The smallest item is:", "c": ["4", "2", "1", "6"], "a": 2, "e": "Looking at all items, 1 is the smallest value in the list.", "hint": "Which number is smallest?"}, {"t": 1, "topic": "Selection Sort", "q": "After finding the minimum in Selection Sort, what happens next?", "c": ["Delete it", "Sort it separately", "Swap it to the beginning", "Double it"], "a": 2, "e": "We swap the minimum with the first unsorted item to place it in the correct position.", "hint": "We exchange positions with something."}, {"t": 1, "topic": "Selection Sort", "q": "How many times does Selection Sort scan for the minimum?", "c": ["Once", "Twice", "n-1 times", "It depends"], "a": 2, "e": "Selection Sort finds the minimum n-1 times because after n-1 correct placements, the last item is automatically sorted.", "hint": "For each position except the last."}, {"t": 1, "topic": "Selection Sort", "q": "Is Selection Sort stable?", "c": ["Yes, it preserves order", "No, it can change relative order", "Sometimes", "It depends on data"], "a": 1, "e": "Selection Sort is unstable because swapping can change the relative order of equal elements.", "hint": "Does swapping affect equal elements?"}, {"t": 1, "topic": "Selection Sort", "q": "What is an advantage of Selection Sort?", "c": ["It's very fast", "It uses minimal extra memory", "It's easy to parallelize", "It's always O(n log n)"], "a": 1, "e": "Selection Sort works in-place, using only a constant amount of extra space.", "hint": "Think about space usage."}, {"t": 1, "topic": "Selection Sort", "q": "What is the time complexity of Selection Sort?", "c": ["O(n)", "O(n log n)", "O(n\u00b2)", "O(1)"], "a": 2, "e": "Selection Sort is O(n\u00b2) in all cases because it always scans for the minimum multiple times.", "hint": "It doesn't improve based on input."}, {"t": 1, "topic": "Selection Sort", "q": "Selection Sort [5, 2, 8, 1, 9]. After round 1, what is the list?", "c": ["[1, 5, 2, 8, 9]", "[1, 2, 8, 5, 9]", "[1, 2, 5, 8, 9]", "[5, 1, 2, 8, 9]"], "a": 0, "e": "Find smallest (1), swap with first (5). List becomes [1, 5, 2, 8, 9].", "hint": "Only the first swap happens."}, {"t": 1, "topic": "Selection Sort", "q": "How many swaps does Selection Sort perform on a 5-item unsorted list?", "c": ["0", "4", "5", "10"], "a": 1, "e": "Selection Sort performs at most n-1 swaps (one per position except the last).", "hint": "At most one swap per round."}, {"t": 1, "topic": "Insertion Sort", "q": "In Insertion Sort, what is inserted into a sorted portion?", "c": ["The largest unsorted item", "The smallest unsorted item", "The next unsorted item", "A random item"], "a": 2, "e": "Insertion Sort takes each unsorted item and inserts it into the correct position in the already-sorted portion.", "hint": "You process items one by one."}, {"t": 1, "topic": "Insertion Sort", "q": "Insertion Sort is like organizing:", "c": ["A pile of books", "Playing cards in your hand", "A file cabinet", "A sandwich"], "a": 1, "e": "Insertion Sort is like picking up cards one by one and inserting each into the correct position in your sorted hand.", "hint": "Think of card games."}, {"t": 1, "topic": "Insertion Sort", "q": "What makes Insertion Sort efficient for nearly-sorted data?", "c": ["It's always fast", "It skips already-sorted items", "It doesn't need comparisons", "It uses recursion"], "a": 1, "e": "If data is nearly sorted, few items need to be shifted, making Insertion Sort very quick.", "hint": "Already-sorted data means less work."}, {"t": 1, "topic": "Insertion Sort", "q": "Insertion Sort [5, 2, 8]. After inserting 2, the list is:", "c": ["[5, 2, 8]", "[2, 5, 8]", "[5, 8, 2]", "[8, 5, 2]"], "a": 1, "e": "We take 2 and shift 5 right, then insert 2 at the beginning: [2, 5, 8].", "hint": "2 should go before 5."}, {"t": 1, "topic": "Insertion Sort", "q": "Is Insertion Sort stable?", "c": ["Yes", "No", "Sometimes", "Only for numbers"], "a": 0, "e": "Insertion Sort is stable because equal elements maintain their original relative order.", "hint": "Does it preserve the order of equal items?"}, {"t": 1, "topic": "Insertion Sort", "q": "What is the time complexity of Insertion Sort in the best case?", "c": ["O( n each half divides again.", "hint": "It divides in the middle."}, {"t": 5, "topic": "Merge Sort", "q": "What is the time complexity of Merge Sort?", "c": ["O(n)", "O(n log n)", "O(n\u00b2)", "O(log n)"], "a": 1, "e": "Merge Sort is O(n log n) in all cases (best, average, worst).", "hint": "Always the same complexity."}, {"t": 5, "topic": "Merge Sort", "q": "How much extra memory does Merge Sort need?", "c": ["O(1)", "O(log n)", "O(n)", "O(n\u00b2)"], "a": 2, "e": "Merge Sort needs O(n) extra space for the merging process.", "hint": "It needs space proportional to the input size."}, {"t": 5, "topic": "Merge Sort", "q": "Is Merge Sort adaptive?", "c": ["Yes, it speeds up on sorted data", "No, it doesn't adapt", "Only for certain inputs", "It depends on the pivot"], "a": 1, "e": "Merge Sort is not adaptive\u2014it always takes O(n log n) regardless of input order.", "hint": "It doesn't exploit existing order."}, {"t": 5, "topic": "Merge Sort", "q": "Merge Sort uses which technique?", "c": ["Greedy", "Divide and Conquer", "Dynamic Programming", "Backtracking"], "a": 1, "e": "Merge Sort uses divide-and-conquer: divide into halves, sort recursively, then merge.", "hint": "Divide-and-merge approach."}];
var currentTest=1, topicFilter="all", activeQuestions=[],currentIndex=0,answers=[],correct=0,wrong=0;
var canvas=document.getElementById("annot-canvas"), ctx=canvas.getContext("2d");
var tool="select", strokeColor="#1a1a1a", strokeW=2, isDrawing=false, startX=0, startY=0, lastX=0, lastY=0;
var strokes=[], currentPath=[], snapShot=null, annotationsEnabled=true;

function resizeCanvas(){canvas.width=window.innerWidth;canvas.height=window.innerHeight;redraw();}
window.addEventListener("resize", resizeCanvas);
resizeCanvas();

function toggleAnnotations(){
  annotationsEnabled=!annotationsEnabled;
  var t=document.getElementById("annot-toggle");
  var c=document.getElementById("canvas-container");
  var tb=document.getElementById("annot-toolbar");
  var m=document.getElementById("main-col");
  if(annotationsEnabled){t.textContent="📝 Annotations: ON";t.classList.remove("off");c.classList.remove("off");tb.classList.remove("off");m.classList.remove("annot-off");}
  else{t.textContent="📝 Annotations: OFF";t.classList.add("off");c.classList.add("off");tb.classList.add("off");m.classList.add("annot-off");}
}

function setTool(t){
  tool=t;
  document.querySelectorAll(".tool-btn").forEach(b=>b.classList.remove("active"));
  event.target.classList.add("active");
}

function setColor(e){
  document.querySelectorAll(".cswatch").forEach(s=>s.classList.remove("active"));
  e.classList.add("active");
  strokeColor=e.getAttribute("data-c");
}

function redraw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  strokes.forEach(s=>{
    ctx.save();
    ctx.strokeStyle=s.color;
    ctx.lineWidth=s.width;
    ctx.lineCap="round";
    if(s.type==="highlight"){ctx.globalAlpha=0.3;ctx.lineWidth=s.width*8;}
    if(s.type==="pen"||s.type==="highlight"){
      ctx.beginPath();
      s.pts.forEach((p,i)=>i===0?ctx.moveTo(p.x,p.y):ctx.lineTo(p.x,p.y));
      ctx.stroke();
    }else if(s.type==="line"){ctx.beginPath();ctx.moveTo(s.x1,s.y1);ctx.lineTo(s.x2,s.y2);ctx.stroke();}
    else if(s.type==="rect"){ctx.strokeRect(s.x,s.y,s.w,s.h);}
    else if(s.type==="circle"){ctx.beginPath();ctx.ellipse(s.cx,s.cy,s.rx,s.ry,0,0,Math.PI*2);ctx.stroke();}
    ctx.restore();
  });
}

canvas.addEventListener("pointerdown",e=>{
  if(tool==="select"||!annotationsEnabled)return;
  e.preventDefault();
  isDrawing=true;
  startX=e.clientX;startY=e.clientY;lastX=e.clientX;lastY=e.clientY;
  if(tool==="pen"||tool==="highlight")currentPath=[{x:e.clientX,y:e.clientY}];
  snapShot=ctx.getImageData(0,0,canvas.width,canvas.height);
},{passive:false});

canvas.addEventListener("pointermove",e=>{
  if(!isDrawing)return;
  e.preventDefault();
  if(tool==="pen"||tool==="highlight"){
    currentPath.push({x:e.clientX,y:e.clientY});
    ctx.save();ctx.strokeStyle=strokeColor;ctx.lineWidth=tool==="highlight"?strokeW*8:strokeW;
    ctx.globalAlpha=tool==="highlight"?0.3:1;ctx.lineCap="round";ctx.beginPath();
    ctx.moveTo(lastX,lastY);ctx.lineTo(e.clientX,e.clientY);ctx.stroke();ctx.restore();
    lastX=e.clientX;lastY=e.clientY;
  }else{
    ctx.putImageData(snapShot,0,0);ctx.save();ctx.strokeStyle=strokeColor;ctx.lineWidth=strokeW;
    if(tool==="line"){ctx.beginPath();ctx.moveTo(startX,startY);ctx.lineTo(e.clientX,e.clientY);ctx.stroke();}
    else if(tool==="rect"){ctx.strokeRect(Math.min(startX,e.clientX),Math.min(startY,e.clientY),Math.abs(e.clientX-startX),Math.abs(e.clientY-startY));}
    else if(tool==="circle"){var cx=(startX+e.clientX)/2,cy=(startY+e.clientY)/2;ctx.beginPath();ctx.ellipse(cx,cy,Math.abs(e.clientX-startX)/2,Math.abs(e.clientY-startY)/2,0,0,Math.PI*2);ctx.stroke();}
    ctx.restore();
  }
},{passive:false});

canvas.addEventListener("pointerup",e=>{
  if(!isDrawing)return;
  isDrawing=false;
  if(tool==="pen"||tool==="highlight"){strokes.push({type:tool,color:strokeColor,width:strokeW,pts:currentPath});currentPath=[];}
  else if(tool==="line"){strokes.push({type:"line",color:strokeColor,width:strokeW,x1:startX,y1:startY,x2:e.clientX,y2:e.clientY});ctx.putImageData(snapShot,0,0);redraw();}
  else if(tool==="rect"){strokes.push({type:"rect",color:strokeColor,width:strokeW,x:Math.min(startX,e.clientX),y:Math.min(startY,e.clientY),w:Math.abs(e.clientX-startX),h:Math.abs(e.clientY-startY)});ctx.putImageData(snapShot,0,0);redraw();}
  else if(tool==="circle"){var cx=(startX+e.clientX)/2,cy=(startY+e.clientY)/2;strokes.push({type:"circle",color:strokeColor,width:strokeW,cx,cy,rx:Math.abs(e.clientX-startX)/2||1,ry:Math.abs(e.clientY-startY)/2||1});ctx.putImageData(snapShot,0,0);redraw();}
  snapShot=null;
},{passive:false});

function undoLast(){if(strokes.length>0){strokes.pop();redraw();}}
function clearCanvas(){if(confirm("Clear?")){strokes=[];redraw();}}

function shuffle(a){var arr=a.slice();for(var i=arr.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=arr[i];arr[i]=arr[j];arr[j]=t;}return arr;}

function initQuiz(){
  var topics=[...new Set(ALL_QUESTIONS.map(q=>q.topic))].sort();
  var tf=document.getElementById("topic-filter");
  topics.forEach(t=>{var o=document.createElement("option");o.value=t;o.textContent=t;tf.appendChild(o);});
  var ts=document.getElementById("test-selector");
  ["All","Test 1","Test 2","Test 3","Test 4","Test 5"].forEach((l,i)=>{
    var b=document.createElement("button");b.className="test-btn"+(i===0?" active":"");b.textContent=l;
    b.onclick=(function(t){return function(){document.querySelectorAll(".test-btn").forEach(x=>x.classList.remove("active"));this.classList.add("active");currentTest=t;};})(i);
    ts.appendChild(b);
  });
}

function startTest(){
  var pool=currentTest===0?ALL_QUESTIONS:ALL_QUESTIONS.filter(q=>q.t===currentTest);
  if(topicFilter!=="all")pool=pool.filter(q=>q.topic===topicFilter);
  if(pool.length===0){alert("No questions.");return;}
  activeQuestions=shuffle(pool).slice(0,50);
  answers=[];for(var i=0;i<activeQuestions.length;i++)answers.push(null);
  correct=0;wrong=0;currentIndex=0;
  document.getElementById("view-start").style.display="none";
  document.getElementById("view-test").style.display="block";
  document.getElementById("hint-btn").disabled=false;
  renderQ();
}

function renderQ(){
  var q=activeQuestions[currentIndex],total=activeQuestions.length;
  document.getElementById("s-cur").textContent=(currentIndex+1)+" / "+total;
  document.getElementById("s-cor").textContent=correct;
  document.getElementById("s-wrg").textContent=wrong;
  var answered=correct+wrong;
  document.getElementById("s-pct").textContent=answered>0?Math.round(correct/answered*100)+"%":"--";
  document.getElementById("prog").style.width=(currentIndex/total*100)+"%";
  document.getElementById("q-num").textContent="Q"+(currentIndex+1);
  document.getElementById("q-topic").textContent=q.topic;
  document.getElementById("q-text").textContent=q.q;
  var choicesEl=document.getElementById("choices");choicesEl.innerHTML="";
  var prev=answers[currentIndex];
  q.c.forEach(function(text,i){
    var btn=document.createElement("button");btn.className="choice";
    if(prev!==null){btn.classList.add("locked");if(i===q.a)btn.classList.add("correct-ans");else if(i===prev&&prev!==q.a)btn.classList.add("wrong-ans");}
    var letter=document.createElement("span");letter.className="choice-letter";letter.textContent=String.fromCharCode(65+i)+")";
    var txt=document.createElement("span");txt.textContent=text;
    btn.appendChild(letter);btn.appendChild(txt);
    if(prev===null)(function(idx){btn.onclick=function(){selectAnswer(idx);};})(i);
    choicesEl.appendChild(btn);
  });
  var expEl=document.getElementById("explanation");
  if(prev!==null){expEl.className="explanation show "+(prev===q.a?"correct-exp":"wrong-exp");document.getElementById("exp-icon").textContent=prev===q.a?"Correct!":"Not quite:";document.getElementById("exp-text").textContent=q.e;}
  else{expEl.className="explanation";}
  document.getElementById("btn-back").disabled=currentIndex===0;
  document.getElementById("btn-next").disabled=prev===null;
}

function selectAnswer(i){if(answers[currentIndex]!==null)return;var q=activeQuestions[currentIndex];answers[currentIndex]=i;if(i===q.a)correct++;else wrong++;renderQ();}
function nextQ(){if(currentIndex<activeQuestions.length-1){currentIndex++;renderQ();}else showResults();}
function goBack(){if(currentIndex>0){currentIndex--;renderQ();}}
function finishEarly(){if(confirm("Finish?"))showResults();}
function showHint(){var q=activeQuestions[currentIndex];if(!q.hint)return;var p=document.createElement("div");p.className="hint-popup";p.innerHTML=`<div class="hint-close" onclick="this.parentElement.remove()">×</div><strong>Hint:</strong> ${q.hint}`;document.body.appendChild(p);setTimeout(()=>p.remove(),5000);}
function showResults(){document.getElementById("view-test").style.display="none";document.getElementById("view-results").style.display="block";var total=activeQuestions.length,skipped=total-correct-wrong,pct=total>0?Math.round(correct/total*100):0;document.getElementById("r-score").textContent=pct+"%";document.getElementById("r-label").textContent=correct+" / "+total;document.getElementById("r-cor").textContent=correct;document.getElementById("r-wrg").textContent=wrong;document.getElementById("r-skp").textContent=skipped;document.getElementById("r-tot").textContent=total;var grade=pct>=90?"A":pct>=80?"B":pct>=70?"C":"Keep practicing";document.getElementById("r-grade").textContent=grade;}
function reviewWrong(){var missed=[];activeQuestions.forEach(function(q,i){if(answers[i]!==null&&answers[i]!==q.a)missed.push({q:q,a:answers[i],i});});if(missed.length===0){alert("Perfect!");return;}var sec=document.getElementById("review-section"),list=document.getElementById("review-list");document.getElementById("review-title").textContent="Wrong ("+missed.length+")";list.innerHTML="";missed.forEach(m=>{var div=document.createElement("div");div.className="ri";div.innerHTML=`<div class="rmeta">Q${m.i+1} • ${m.q.topic}</div><div class="rq">${m.q.q}</div><div class="ra wrong">Your: ${String.fromCharCode(65+m.a)})</div><div class="ra correct">Correct: ${String.fromCharCode(65+m.q.a)})</div><div class="re">${m.q.e}</div>`;list.appendChild(div);});sec.style.display="block";}
function showStart(){document.getElementById("view-start").style.display="block";document.getElementById("view-test").style.display="none";document.getElementById("view-results").style.display="none";document.getElementById("hint-btn").disabled=true;}

initQuiz();
</script>
</body>
</html>
