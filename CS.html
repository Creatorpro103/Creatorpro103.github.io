<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>National Beta CS Comprehensive Test</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:#f5f5f5;color:#1a1a1a;min-height:100vh;display:flex}
#main-col{flex:1;min-width:0;padding:1.5rem;overflow-y:auto;height:100vh}
#annot-panel{width:290px;flex-shrink:0;background:#fff;border-left:1px solid #e5e5e5;display:flex;flex-direction:column;height:100vh}
#annot-toolbar{padding:10px;border-bottom:1px solid #e5e5e5;display:flex;flex-direction:column;gap:7px}
#annot-toolbar h2{font-size:11px;font-weight:600;color:#888;text-transform:uppercase;letter-spacing:.06em}
.tool-row{display:flex;gap:4px;flex-wrap:wrap}
.tool-btn{padding:5px 8px;border-radius:6px;border:1px solid #d1d5db;background:#fff;color:#1a1a1a;font-size:12px;cursor:pointer;display:flex;align-items:center;gap:4px;white-space:nowrap;transition:background .1s}
.tool-btn:hover{background:#f3f4f6}
.tool-btn.active{background:#1a1a1a;color:#fff;border-color:#1a1a1a}
.tool-btn svg{width:13px;height:13px;flex-shrink:0;pointer-events:none}
.color-row{display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.color-row span{font-size:12px;color:#555}
.cswatch{width:19px;height:19px;border-radius:50%;cursor:pointer;border:2px solid transparent;flex-shrink:0;transition:border-color .1s}
.cswatch.active{border-color:#1a1a1a}
.size-row{display:flex;align-items:center;gap:6px;font-size:12px;color:#555}
#stroke-size{flex:1;accent-color:#1a1a1a}
.ann-btns{display:flex;gap:4px}
.ann-btns button{flex:1;padding:4px 4px;border-radius:6px;border:1px solid #d1d5db;background:#fff;font-size:11px;cursor:pointer;font-family:inherit;white-space:nowrap}
.ann-btns button:hover{background:#f3f4f6}
#annot-canvas-wrap{flex:1;position:relative;overflow:hidden;background:repeating-linear-gradient(0deg,transparent,transparent 24px,#f0f0f0 24px,#f0f0f0 25px),repeating-linear-gradient(90deg,transparent,transparent 24px,#f0f0f0 24px,#f0f0f0 25px)}
#annot-canvas{position:absolute;top:0;left:0;width:100%;height:100%;cursor:crosshair;touch-action:none}
#annot-canvas.sel{cursor:default}
.container{max-width:680px;margin:0 auto}
h1{font-size:20px;font-weight:600;margin-bottom:4px}
.subtitle{font-size:14px;color:#666;margin-bottom:1.5rem}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:1.25rem}
.stat{background:#fff;border-radius:10px;padding:.75rem 1rem;text-align:center;border:1px solid #e5e5e5}
.stat-label{font-size:11px;color:#888;margin-bottom:4px;text-transform:uppercase;letter-spacing:.04em}
.stat-val{font-size:22px;font-weight:600}
.stat-val.green{color:#16a34a}.stat-val.red{color:#dc2626}
.progress-bar{height:6px;background:#e5e5e5;border-radius:3px;margin-bottom:1.25rem;overflow:hidden}
.progress-fill{height:100%;background:#2563eb;border-radius:3px;transition:width .4s ease}
.card{background:#fff;border:1px solid #e5e5e5;border-radius:12px;padding:1.25rem 1.5rem;margin-bottom:1rem}
.q-meta{font-size:12px;color:#999;margin-bottom:.75rem;display:flex;justify-content:space-between;align-items:center}
.topic-badge{background:#eff6ff;color:#1d4ed8;padding:2px 10px;border-radius:20px;font-size:11px;font-weight:500}
.q-text{font-size:15px;line-height:1.6;margin-bottom:1.25rem;font-weight:500}
.choices{display:flex;flex-direction:column;gap:8px}
.choice{display:flex;align-items:flex-start;gap:10px;padding:.7rem 1rem;border:1px solid #e5e5e5;border-radius:8px;cursor:pointer;font-size:14px;line-height:1.5;transition:background .15s,border-color .15s;background:#fff;text-align:left;width:100%}
.choice:hover:not(.locked){background:#f8f8f8;border-color:#ccc}
.choice.correct-ans{border-color:#16a34a!important;background:#f0fdf4!important}
.choice.wrong-ans{border-color:#dc2626!important;background:#fef2f2!important}
.choice-letter{font-weight:600;min-width:20px;color:#888;padding-top:1px;flex-shrink:0}
.explanation{margin-top:1rem;padding:.9rem 1.1rem;border-radius:8px;font-size:14px;line-height:1.6;display:none}
.explanation.wrong-exp{background:#fef2f2;border-left:3px solid #dc2626;color:#991b1b}
.explanation.correct-exp{background:#f0fdf4;border-left:3px solid #16a34a;color:#166534}
.explanation.show{display:block}
.exp-title{font-weight:600;margin-bottom:4px;display:block;font-size:13px}
.actions{display:flex;gap:10px;margin-top:1rem;flex-wrap:wrap}
button{padding:.55rem 1.1rem;border-radius:8px;border:1px solid #d1d5db;background:#fff;color:#1a1a1a;font-size:14px;cursor:pointer;font-family:inherit;transition:background .15s,opacity .15s}
button:hover:not(:disabled){background:#f3f4f6}
button.primary{background:#1a1a1a;color:#fff;border-color:#1a1a1a}
button.primary:hover:not(:disabled){opacity:.85}
button:disabled{opacity:.35;cursor:default}
button.dbtn{border-color:#dc2626;color:#dc2626}
button.dbtn:hover{background:#fef2f2}
.rw{text-align:center;padding:2rem 1rem}
.rscore{font-size:64px;font-weight:700;line-height:1;margin-bottom:.4rem}
.rlabel{font-size:15px;color:#666;margin-bottom:.5rem}
.rgrade{font-size:20px;font-weight:600;margin-bottom:2rem}
.test-selector{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:1.25rem}
.test-btn{padding:.4rem .9rem;border-radius:20px;border:1px solid #d1d5db;background:#fff;color:#1a1a1a;font-size:13px;cursor:pointer;font-family:inherit}
.test-btn:hover{background:#f3f4f6}
.test-btn.active{background:#1a1a1a;color:#fff;border-color:#1a1a1a}
.filter-row{display:flex;align-items:center;gap:12px;margin-bottom:1.25rem;flex-wrap:wrap}
.filter-row label{font-size:13px;color:#555;font-weight:500}
select{padding:.4rem .7rem;border-radius:8px;border:1px solid #d1d5db;background:#fff;color:#1a1a1a;font-size:13px;font-family:inherit}
.sbw{margin-top:1rem}.sbw button{width:100%;padding:.9rem;font-size:15px;font-weight:500}
.stitle{font-size:15px;font-weight:600;margin-bottom:1rem}
.ri{background:#fff;border:1px solid #e5e5e5;border-radius:12px;padding:1.1rem 1.25rem;margin-bottom:12px}
.rq{font-size:14px;font-weight:500;margin-bottom:.75rem;line-height:1.5}
.ra{font-size:13px;padding:.5rem .75rem;border-radius:6px;margin-bottom:6px;line-height:1.5}
.ra.wrong{background:#fef2f2;color:#991b1b}.ra.correct{background:#f0fdf4;color:#166534}
.re{font-size:13px;padding:.5rem .75rem;border-radius:6px;background:#f8f8f8;color:#444;line-height:1.6}
.divider{height:1px;background:#e5e5e5;margin:1.5rem 0}
.rstats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:1.5rem;text-align:left}
.rmeta{font-size:12px;color:#999;display:flex;justify-content:space-between;align-items:center;margin-bottom:.6rem}
@media(max-width:600px){body{flex-direction:column}#annot-panel{width:100%;height:300px;border-left:none;border-top:1px solid #e5e5e5}.stats,.rstats{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>

<div id="main-col"><div class="container">

<div id="view-start">
<h1>National Beta CS Comprehensive Tests</h1>
<p class="subtitle">6th Grade Computer Science — 250 questions (50 per test)</p>
<div class="test-selector" id="test-selector"></div>
<div class="filter-row"><label>Topic:</label><select id="topic-filter"><option value="all">All topics</option></select></div>
<div class="sbw"><button class="primary" onclick="startTest()">Start Test</button></div>
</div>

<div id="view-test" style="display:none">
<div class="stats"><div class="stat"><div class="stat-label">Question</div><div class="stat-val" id="s-cur">1</div></div><div class="stat"><div class="stat-label">Correct</div><div class="stat-val green" id="s-cor">0</div></div><div class="stat"><div class="stat-label">Wrong</div><div class="stat-val red" id="s-wrg">0</div></div><div class="stat"><div class="stat-label">Score</div><div class="stat-val" id="s-pct">&mdash;</div></div></div>
<div class="progress-bar"><div class="progress-fill" id="prog" style="width:0%"></div></div>
<div class="card"><div class="q-meta"><span id="q-num"></span><span class="topic-badge" id="q-topic"></span></div><div class="q-text" id="q-text"></div><div class="choices" id="choices"></div><div class="explanation" id="explanation"><span class="exp-title" id="exp-icon"></span><span id="exp-text"></span></div></div>
<div class="actions"><button onclick="goBack()" id="btn-back" disabled>&larr; Back</button><button class="primary" onclick="nextQ()" id="btn-next" disabled>Next &rarr;</button><button class="dbtn" onclick="finishEarly()" style="margin-left:auto">Finish Test</button></div>
</div>

<div id="view-results" style="display:none">
<div class="rw"><div class="rscore" id="r-score"></div><div class="rlabel" id="r-label"></div><div class="rgrade" id="r-grade"></div>
<div class="rstats"><div class="stat"><div class="stat-label">Correct</div><div class="stat-val green" id="r-cor"></div></div><div class="stat"><div class="stat-label">Wrong</div><div class="stat-val red" id="r-wrg"></div></div><div class="stat"><div class="stat-label">Skipped</div><div class="stat-val" id="r-skp"></div></div><div class="stat"><div class="stat-label">Total</div><div class="stat-val" id="r-tot"></div></div></div>
<div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap"><button class="primary" onclick="reviewWrong()">Review Wrong Answers</button><button onclick="showStart()">New Test</button></div></div>
<div id="review-section" style="display:none;margin-top:1rem"><div class="divider"></div><div class="stitle" id="review-title"></div><div id="review-list"></div></div>
</div>

</div></div>

<div id="annot-panel">
<div id="annot-toolbar">
<h2>Annotate</h2>
<div class="tool-row">
<button class="tool-btn active" id="tool-select" onclick="setTool('select')" title="Select"><svg viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg"><path d="M3 2l10 6-5 1-2 5z" fill="currentColor"/></svg>Select</button>
<button class="tool-btn" id="tool-pen" onclick="setTool('pen')" title="Draw"><svg viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg"><path d="M11 2l3 3-8 8H3v-3z" stroke="currentColor" fill="none" stroke-width="1.5"/></svg>Draw</button>
<button class="tool-btn" id="tool-line" onclick="setTool('line')" title="Line"><svg viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg"><line x1="2" y1="14" x2="14" y2="2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>Line</button>
<button class="tool-btn" id="tool-rect" onclick="setTool('rect')" title="Box"><svg viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg"><rect x="2" y="4" width="12" height="9" rx="1" stroke="currentColor" fill="none" stroke-width="1.5"/></svg>Box</button>
<button class="tool-btn" id="tool-circle" onclick="setTool('circle')" title="Circle"><svg viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg"><circle cx="8" cy="8" r="6" stroke="currentColor" fill="none" stroke-width="1.5"/></svg>Circle</button>
<button class="tool-btn" id="tool-highlight" onclick="setTool('highlight')" title="Highlight"><svg viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg"><rect x="2" y="6" width="12" height="5" rx="1" fill="rgba(255,200,0,.5)" stroke="currentColor" stroke-width="1.5"/></svg>Highlight</button>
</div>
<div class="color-row"><span>Color:</span>
<div class="cswatch active" data-c="#1a1a1a" style="background:#1a1a1a" onclick="setColor(this)"></div>
<div class="cswatch" data-c="#dc2626" style="background:#dc2626" onclick="setColor(this)"></div>
<div class="cswatch" data-c="#2563eb" style="background:#2563eb" onclick="setColor(this)"></div>
<div class="cswatch" data-c="#16a34a" style="background:#16a34a" onclick="setColor(this)"></div>
<div class="cswatch" data-c="#d97706" style="background:#d97706" onclick="setColor(this)"></div>
</div>
<div class="size-row"><span>Size:</span><input type="range" id="stroke-size" min="1" max="20" value="2" step="1" oninput="strokeW=+this.value;document.getElementById('sv').textContent=this.value"><span id="sv">2</span>px</div>
<div class="ann-btns">
<button onclick="undoLast()">↶ Undo</button>
<button onclick="clearCanvas()">Clear</button>
<button onclick="savePNG()">Save</button>
</div>
</div>
<div id="annot-canvas-wrap"><canvas id="annot-canvas"></canvas></div>
</div>

<script>
var ALL_QUESTIONS=[
{t:1,topic:"Binary",q:"Convert decimal 13 to binary.",c:["1011","1100","1101","1010"],a:2,e:"13 = 8+4+1 = 1101 in binary."},
{t:1,topic:"Hardware",q:"What does CPU stand for?",c:["Central Programming Unit","Computer Processing Utility","Central Processing Unit","Core Processing Unit"],a:2,e:"CPU = Central Processing Unit — the brain of the computer."},
{t:1,topic:"Flowcharts",q:"What shape represents a DECISION in a flowchart?",c:["Rectangle","Oval","Diamond","Parallelogram"],a:2,e:"The diamond shape represents a decision point with YES/NO branches."},
{t:1,topic:"Coding",q:"A VARIABLE is best described as:",c:["A fixed value that never changes","A named storage location that holds a value","A function that performs a calculation","An error in the code"],a:1,e:"A variable is a named container in memory that can store and change values."},
{t:1,topic:"Sorting",q:"Which sorting algorithm compares adjacent items and swaps them?",c:["Binary sort","Merge sort","Bubble sort","Linear sort"],a:2,e:"Bubble sort repeatedly compares adjacent pairs and swaps them until sorted."},
{t:1,topic:"Hardware",q:"RAM is best described as:",c:["Permanent storage when power is off","Temporary memory that loses data when power is off","An external hard drive","Read-only memory for BIOS"],a:1,e:"RAM is volatile—it loses data when the computer powers off."},
{t:1,topic:"Digital Citizenship",q:"What is a digital footprint?",c:["A virus tracking your location","The power your computer uses","The trail of data you leave online","An electronic signature"],a:2,e:"Your digital footprint is all the data created by your online activity."},
{t:1,topic:"Networking",q:"Rules for data transmission across the internet are called:",c:["Algorithms","Protocols","Bandwidth","Firmware"],a:1,e:"A protocol is a set of rules for data communication. TCP/IP is the main one."},
{t:1,topic:"Web/Internet",q:"What does HTML stand for?",c:["HyperText Markup Language","High-Tech Media Language","HyperText Management Level","Hyper Transfer Markup Language"],a:0,e:"HTML = HyperText Markup Language — the standard language for web pages."},
{t:1,topic:"Sorting",q:"Why is Quick Sort fast?",c:["It is simple","It uses divide-and-conquer with a pivot","It uses little memory","It works on any data"],a:1,e:"Quick Sort divides the list using a pivot, making it much faster."},
{t:1,topic:"Coding",q:"Which causes code to repeat?",c:["Sequence","Selection","Iteration","Function"],a:2,e:"Iteration (loops) repeats code—either FOR or WHILE loops."},
{t:1,topic:"History",q:"Ada Lovelace is recognized as:",c:["The transistor inventor","The first computer programmer","The Web creator","The first microprocessor developer"],a:1,e:"Ada Lovelace wrote the first algorithm for a mechanical computing engine."},
{t:1,topic:"Data",q:"In a database, a RECORD is:",c:["A column of data","A copy of the database","One complete row of data","A search query"],a:2,e:"A record is one complete row in a table with all field values."},
{t:1,topic:"Networking",q:"Which device connects home network to internet?",c:["Switch","Hub","Router","Bridge"],a:2,e:"A router directs traffic between your local network and the internet."},
{t:1,topic:"Sorting",q:"Insertion Sort is like:",c:["Picking smallest items","Comparing adjacent items","Organizing cards in your hand","Dividing into groups"],a:2,e:"Insertion Sort is like organizing cards—you pick one and insert it in the right position."},
{t:1,topic:"Coding",q:"Debugging means:",c:["Writing first draft code","Testing with users","Finding and fixing errors","Converting to machine language"],a:2,e:"Debugging is identifying and correcting bugs (errors) in a program."},
{t:1,topic:"Hardware",q:"Which is an OUTPUT device?",c:["Keyboard","Webcam","Microphone","Monitor"],a:3,e:"A monitor displays information FROM the computer—it outputs data."},
{t:1,topic:"Binary",q:"What is binary 1010 in decimal?",c:["8","10","12","14"],a:1,e:"1010 = 8+0+2+0 = 10 in decimal."},
{t:1,topic:"Digital Citizenship",q:"Cyberbullying is:",c:["Spreading computer viruses","Using technology to harass others","Accessing systems without permission","Downloading copyrighted material"],a:1,e:"Cyberbullying is using digital platforms to harass or intimidate someone."},
{t:1,topic:"Networking",q:"What does DNS do?",c:["Stores files in cloud","Translates web addresses to IP addresses","Routes data packets","Assigns IP addresses"],a:1,e:"DNS converts google.com into the numerical IP address."},
{t:1,topic:"Sorting",q:"What is the first step in Merge Sort?",c:["Find pivot","Compare adjacent items","Divide list in half","Find smallest item"],a:2,e:"Merge Sort starts by dividing the list repeatedly until pieces are size 1."},
{t:1,topic:"Coding",q:"IF statements run code:",c:["Always","Only if condition is true","Only if condition is false","A random number of times"],a:1,e:"IF statements check a condition and run code only if it is true."},
{t:1,topic:"Hardware",q:"What stores startup instructions?",c:["RAM","Cache","ROM","SSD"],a:2,e:"ROM stores firmware/BIOS—the startup instructions before OS loads."},
{t:1,topic:"History",q:"ENIAC was:",c:["A programming language","One of the first electronic computers","The internet organization","The first personal computer"],a:1,e:"ENIAC (1945) was one of the first general-purpose electronic computers."},
{t:1,topic:"Sorting",q:"Selection Sort moves smallest to:",c:["End of list","Middle of list","Beginning of list","Random position"],a:2,e:"Selection Sort finds the smallest and moves it to the beginning."},
{t:1,topic:"Binary",q:"How many bits in 1 byte?",c:["4","16","8","2"],a:2,e:"1 byte = 8 bits. This is fundamental to digital storage."},
{t:1,topic:"Web/Internet",q:"HTTPS means:",c:["Government-owned site","Encrypted and secure","Requires login","Hosted in USA"],a:1,e:"HTTPS means the connection is encrypted. Look for the padlock icon!"},
{t:1,topic:"Coding",q:"FOR i=1 TO 5 executes how many times?",c:["4","6","5","1"],a:2,e:"i goes 1,2,3,4,5—that is exactly 5 times."},
{t:1,topic:"Data",q:"BINARY SEARCH works by:",c:["Checking left to right","Random checking","Splitting sorted list in half","Sorting first then checking ends"],a:2,e:"Binary search repeatedly halves the search space—very fast!"},
{t:1,topic:"Sorting",q:"MERGE SORT is best for:",c:["Simple understanding","Speed guaranteed","Large unsorted datasets","Very small lists only"],a:2,e:"Merge Sort is always fast and reliable for large datasets."},
{t:1,topic:"Hardware",q:"ROM key characteristic:",c:["Permanent, not erased","Changed by any program","Works with one OS only","Used in DVDs"],a:0,e:"ROM is non-volatile—data stays permanent without power."},
{t:1,topic:"Digital Citizenship",q:"2FA stands for:",c:["Two-File Authentication","Two-Factor Authentication","Two-Firewall Auth","Two-Frequency Access"],a:1,e:"2FA requires a second proof of identity beyond password."},
{t:1,topic:"Flowcharts",q:"OVAL shape represents:",c:["Process step","Input or output","Decision","Start or Stop"],a:3,e:"Ovals mark the Start and Stop of a flowchart."},
{t:1,topic:"Sorting",q:"Which is SLOWEST but SIMPLEST?",c:["Merge Sort","Quick Sort","Bubble Sort","Linear Sort"],a:2,e:"Bubble Sort is simple but very slow for large lists."},
{t:1,topic:"Coding",q:"Boolean data type stores:",c:["Whole numbers","Text","TRUE or FALSE","Decimal numbers"],a:2,e:"Boolean has exactly two values: TRUE or FALSE."},
{t:1,topic:"Hardware",q:"ALU performs:",c:["Stores the OS","Controls I/O","Math and logic operations","Manages internet"],a:2,e:"The ALU handles all math and logical operations."},
{t:1,topic:"Networking",q:"LAN stands for:",c:["Large Area Network","Local Area Network","Long-range Access Network","Link and Node"],a:1,e:"LAN covers a small area like a school or home."},
{t:1,topic:"Sorting",q:"Quick Sort's 'pivot' is:",c:["Smallest number","Largest number","A dividing number","The middle position"],a:2,e:"The pivot divides the list into smaller and bigger items."},
{t:1,topic:"History",q:"2nd Gen computers used:",c:["Vacuum tubes","Transistors","Integrated circuits","Microprocessors"],a:1,e:"2nd Generation (1950s-60s) replaced tubes with transistors."},
{t:1,topic:"Web/Internet",q:"A web browser is used for:",c:["Creating websites","Translating languages","Displaying web pages","Blocking viruses"],a:2,e:"Browsers retrieve and display web pages from the internet."},
{t:1,topic:"Coding",q:"Concatenation means:",c:["Dividing strings","Joining strings together","Converting to string","Searching in string"],a:1,e:"Concatenation joins strings end-to-end: Hello + World = HelloWorld."},
{t:1,topic:"Sorting",q:"Selection Sort finds:",c:["Pairs to compare","Smallest item each iteration","Middle position","Largest value"],a:1,e:"Selection finds the smallest remaining item each time."},
{t:1,topic:"Hardware",q:"Motherboard is the:",c:["CPU only","Main connecting circuit board","Power supply","Hard drive holder"],a:1,e:"The motherboard is the main circuit board connecting everything."},
{t:1,topic:"Digital Citizenship",q:"Open source means:",c:["Free from bugs","Code is publicly available","Linux only","Volunteers only"],a:1,e:"Open source has publicly available code anyone can view and modify."},
{t:1,topic:"Flowcharts",q:"PARALLELOGRAM represents:",c:["Decision","Process","Input or output","Start/end"],a:2,e:"Parallelograms show input/output steps like reading or displaying data."},
{t:1,topic:"Sorting",q:"Bubble Sort named because:",c:["Bubbling sounds","Big items float to top like bubbles","Cleans data","Needs memory"],a:1,e:"Large items 'bubble up' to the end like bubbles in water."},
{t:1,topic:"Binary",q:"Binary 11111111 equals:",c:["128","256","255","127"],a:2,e:"11111111 = 128+64+32+16+8+4+2+1 = 255 (max 1 byte value)."},
{t:1,topic:"Networking",q:"A WAN covers:",c:["One building","A small area","Large distances","Just one city"],a:2,e:"WAN = Wide Area Network covering large distances."},
{t:1,topic:"Coding",q:"A FUNCTION is also called:",c:["A class","A procedure or method","A variable","A loop"],a:1,e:"Functions = procedures = methods = subroutines."},
{t:1,topic:"Hardware",q:"Cache memory is:",c:["On the motherboard","Inside the CPU","On the hard drive","In the power supply"],a:1,e:"Cache is the fastest memory built directly into the CPU."}
];

var testQuestions={};for(var t=1;t<=5;t++){testQuestions[t]=[];}
var currentTest=1,topicFilter="all";
var activeQuestions=[],currentIndex=0,answers=[],correct=0,wrong=0;

function shuffle(arr){var a=arr.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var tmp=a[i];a[i]=a[j];a[j]=tmp;}return a;}

function initQuiz(){
  var allQuestions=JSON.parse(JSON.stringify(ALL_QUESTIONS));
  var topics=[];
  allQuestions.forEach(function(q){if(topics.indexOf(q.topic)<0)topics.push(q.topic);});
  topics.sort();
  var tf=document.getElementById("topic-filter");
  topics.forEach(function(t){var o=document.createElement("option");o.value=t;o.textContent=t;tf.appendChild(o);});
  tf.addEventListener("change",function(e){topicFilter=e.target.value;});
  
  var ts=document.getElementById("test-selector");
  ["All Tests","Test 1","Test 2","Test 3","Test 4","Test 5"].forEach(function(label,i){
    var b=document.createElement("button");
    b.className="test-btn"+(i===0?" active":"");
    b.textContent=label;
    b.onclick=function(){document.querySelectorAll(".test-btn").forEach(function(x){x.classList.remove("active");});b.classList.add("active");currentTest=i;};
    ts.appendChild(b);
  });
  
  for(var t=1;t<=5;t++){testQuestions[t]=allQuestions.filter(function(q){return q.t===t;});}
  console.log("Test 1:",testQuestions[1].length,"questions");
  console.log("Test 2:",testQuestions[2].length,"questions");
  console.log("Test 3:",testQuestions[3].length,"questions");
  console.log("Test 4:",testQuestions[4].length,"questions");
  console.log("Test 5:",testQuestions[5].length,"questions");
}

function startTest(){
  var pool=[];
  if(currentTest===0){
    for(var t=1;t<=5;t++){
      var testQs=testQuestions[t].slice();
      if(topicFilter!=="all")testQs=testQs.filter(function(q){return q.topic===topicFilter;});
      pool=pool.concat(shuffle(testQs).slice(0,10));
    }
  }else{
    pool=testQuestions[currentTest].slice();
    if(topicFilter!=="all")pool=pool.filter(function(q){return q.topic===topicFilter;});
  }
  if(pool.length===0){alert("No questions match your filters.");return;}
  activeQuestions=shuffle(pool);
  answers=[];for(var i=0;i<activeQuestions.length;i++)answers.push(null);
  correct=0;wrong=0;currentIndex=0;
  document.getElementById("view-start").style.display="none";
  document.getElementById("view-test").style.display="block";
  document.getElementById("view-results").style.display="none";
  renderQ();
}

function renderQ(){
  var q=activeQuestions[currentIndex],total=activeQuestions.length;
  document.getElementById("s-cur").textContent=(currentIndex+1)+" / "+total;
  document.getElementById("s-cor").textContent=correct;
  document.getElementById("s-wrg").textContent=wrong;
  var answered=correct+wrong;
  document.getElementById("s-pct").textContent=answered>0?Math.round(correct/answered*100)+"%":"--";
  document.getElementById("prog").style.width=(currentIndex/total*100)+"%";
  document.getElementById("q-num").textContent="Q"+(currentIndex+1);
  document.getElementById("q-topic").textContent=q.topic;
  document.getElementById("q-text").textContent=q.q;
  var choicesEl=document.getElementById("choices");
  choicesEl.innerHTML="";
  var prev=answers[currentIndex];
  q.c.forEach(function(text,i){
    var btn=document.createElement("button");
    btn.className="choice";
    if(prev!==null){
      btn.classList.add("locked");
      if(i===q.a)btn.classList.add("correct-ans");
      else if(i===prev&&prev!==q.a)btn.classList.add("wrong-ans");
    }
    var letter=document.createElement("span");letter.className="choice-letter";letter.textContent=String.fromCharCode(65+i)+")";
    var txt=document.createElement("span");txt.textContent=text;
    btn.appendChild(letter);btn.appendChild(txt);
    if(prev===null)(function(idx){btn.onclick=function(){selectAnswer(idx);};})(i);
    choicesEl.appendChild(btn);
  });
  var expEl=document.getElementById("explanation");
  if(prev!==null){
    expEl.className="explanation show "+(prev===q.a?"correct-exp":"wrong-exp");
    document.getElementById("exp-icon").textContent=prev===q.a?"✓ Correct!":"✗ Not quite:";
    document.getElementById("exp-text").textContent=q.e;
  }else{expEl.className="explanation";}
  document.getElementById("btn-back").disabled=currentIndex===0;
  document.getElementById("btn-next").disabled=prev===null;
}

function selectAnswer(i){if(answers[currentIndex]!==null)return;var q=activeQuestions[currentIndex];answers[currentIndex]=i;if(i===q.a)correct++;else wrong++;renderQ();}
function nextQ(){if(answers[currentIndex]===null)return;if(currentIndex<activeQuestions.length-1){currentIndex++;renderQ();}else showResults();}
function goBack(){if(currentIndex>0){currentIndex--;renderQ();}}
function finishEarly(){if(confirm("Finish test? Unanswered = skipped."))showResults();}

function showResults(){
  document.getElementById("view-test").style.display="none";
  document.getElementById("view-results").style.display="block";
  var total=activeQuestions.length,skipped=total-correct-wrong,pct=total>0?Math.round(correct/total*100):0;
  document.getElementById("r-score").textContent=pct+"%";
  document.getElementById("r-label").textContent=correct+" of "+total+" correct";
  document.getElementById("r-cor").textContent=correct;
  document.getElementById("r-wrg").textContent=wrong;
  document.getElementById("r-skp").textContent=skipped;
  document.getElementById("r-tot").textContent=total;
  var grade,color;
  if(pct>=90){grade="A — Excellent!";color="#16a34a";}
  else if(pct>=80){grade="B — Good job!";color="#2563eb";}
  else if(pct>=70){grade="C — Keep studying!";color="#d97706";}
  else{grade="Keep practicing!";color="#dc2626";}
  var g=document.getElementById("r-grade");g.textContent=grade;g.style.color=color;
}

function reviewWrong(){
  var missed=[];
  activeQuestions.forEach(function(q,i){if(answers[i]!==null&&answers[i]!==q.a)missed.push({q:q,userAnswer:answers[i],idx:i});});
  var sec=document.getElementById("review-section"),list=document.getElementById("review-list");
  if(missed.length===0){alert("Perfect! No wrong answers!");return;}
  document.getElementById("review-title").textContent="Wrong answers ("+missed.length+")";
  list.innerHTML="";
  missed.forEach(function(m){
    var div=document.createElement("div");div.className="ri";
    var meta=document.createElement("div");meta.className="rmeta";
    var sp=document.createElement("span");sp.textContent="Q"+(m.idx+1);
    var badge=document.createElement("span");badge.className="topic-badge";badge.textContent=m.q.topic;
    meta.appendChild(sp);meta.appendChild(badge);
    var qd=document.createElement("div");qd.className="rq";qd.textContent=m.q.q;
    var wa=document.createElement("div");wa.className="ra wrong";wa.innerHTML="Your answer: "+String.fromCharCode(65+m.userAnswer)+") "+m.q.c[m.userAnswer];
    var ca=document.createElement("div");ca.className="ra correct";ca.innerHTML="Correct: "+String.fromCharCode(65+m.q.a)+") "+m.q.c[m.q.a];
    var ex=document.createElement("div");ex.className="re";ex.textContent=m.q.e;
    div.appendChild(meta);div.appendChild(qd);div.appendChild(wa);div.appendChild(ca);div.appendChild(ex);
    list.appendChild(div);
  });
  sec.style.display="block";sec.scrollIntoView({behavior:"smooth"});
}
function showStart(){document.getElementById("view-start").style.display="block";document.getElementById("view-test").style.display="none";document.getElementById("view-results").style.display="none";}

var canvas=document.getElementById("annot-canvas");var ctx=canvas.getContext("2d");var wrap=document.getElementById("annot-canvas-wrap");var tool="select",strokeColor="#1a1a1a",strokeW=2;var isDrawing=false,startX=0,startY=0;var strokes=[],currentPath=[],snapShot=null;

function resizeCanvas(){var w=wrap.clientWidth,h=wrap.clientHeight;canvas.width=w;canvas.height=h;}
function setTool(t){tool=t;document.querySelectorAll(".tool-btn").forEach(function(b){b.classList.remove("active");});document.getElementById("tool-"+t).classList.add("active");canvas.className=t==="select"?"sel":"";}
function setColor(el){document.querySelectorAll(".cswatch").forEach(function(s){s.classList.remove("active");});el.classList.add("active");strokeColor=el.getAttribute("data-c");}
function getPos(e){var r=canvas.getBoundingClientRect();var src=e.touches?e.touches[0]:e;return {x:src.clientX-r.left,y:src.clientY-r.top};}
function redraw(){ctx.clearRect(0,0,canvas.width,canvas.height);strokes.forEach(function(s){ctx.save();ctx.strokeStyle=s.color;ctx.lineWidth=s.width;if(s.type==="highlight"){ctx.globalAlpha=0.35;ctx.lineWidth=s.width*6;}ctx.lineCap="round";ctx.lineJoin="round";if(s.type==="pen"||s.type==="highlight"){ctx.beginPath();s.pts.forEach(function(p,i){if(i===0)ctx.moveTo(p.x,p.y);else ctx.lineTo(p.x,p.y);});ctx.stroke();}else if(s.type==="line"){ctx.beginPath();ctx.moveTo(s.x1,s.y1);ctx.lineTo(s.x2,s.y2);ctx.stroke();}else if(s.type==="rect"){ctx.strokeRect(s.x,s.y,s.w,s.h);}else if(s.type==="circle"){ctx.beginPath();ctx.ellipse(s.cx,s.cy,s.rx,s.ry,0,0,Math.PI*2);ctx.stroke();}ctx.restore();});}
canvas.addEventListener("pointerdown",function(e){e.preventDefault();var pos=getPos(e);isDrawing=true;startX=pos.x;startY=pos.y;if(tool==="pen"||tool==="highlight")currentPath=[{x:pos.x,y:pos.y}];snapShot=ctx.getImageData(0,0,canvas.width,canvas.height);},{passive:false});
canvas.addEventListener("pointermove",function(e){e.preventDefault();if(!isDrawing)return;var pos=getPos(e);if(tool==="pen"||tool==="highlight"){currentPath.push({x:pos.x,y:pos.y});ctx.save();ctx.strokeStyle=strokeColor;ctx.lineWidth=tool==="highlight"?strokeW*6:strokeW;ctx.globalAlpha=tool==="highlight"?0.35:1;ctx.lineCap="round";ctx.beginPath();if(currentPath.length>1)ctx.moveTo(currentPath[currentPath.length-2].x,currentPath[currentPath.length-2].y);ctx.lineTo(pos.x,pos.y);ctx.stroke();ctx.restore();}else{ctx.putImageData(snapShot,0,0);ctx.strokeStyle=strokeColor;ctx.lineWidth=strokeW;if(tool==="line"){ctx.beginPath();ctx.moveTo(startX,startY);ctx.lineTo(pos.x,pos.y);ctx.stroke();}else if(tool==="rect"){ctx.strokeRect(Math.min(startX,pos.x),Math.min(startY,pos.y),Math.abs(pos.x-startX),Math.abs(pos.y-startY));}else if(tool==="circle"){var cx=(startX+pos.x)/2,cy=(startY+pos.y)/2,rx=Math.abs(pos.x-startX)/2||1,ry=Math.abs(pos.y-startY)/2||1;ctx.beginPath();ctx.ellipse(cx,cy,rx,ry,0,0,Math.PI*2);ctx.stroke();}}},{passive:false});
canvas.addEventListener("pointerup",function(e){if(!isDrawing)return;isDrawing=false;if(tool==="pen"||tool==="highlight"){strokes.push({type:tool,color:strokeColor,width:strokeW,pts:currentPath.slice()});}else if(tool==="line"){strokes.push({type:"line",color:strokeColor,width:strokeW,x1:startX,y1:startY,x2:e.clientX-canvas.getBoundingClientRect().left,y2:e.clientY-canvas.getBoundingClientRect().top});}else if(tool==="rect"){var pos=getPos(e);strokes.push({type:"rect",color:strokeColor,width:strokeW,x:Math.min(startX,pos.x),y:Math.min(startY,pos.y),w:Math.abs(pos.x-startX),h:Math.abs(pos.y-startY)});}else if(tool==="circle"){var pos=getPos(e);var cx=(startX+pos.x)/2,cy=(startY+pos.y)/2,rx=Math.abs(pos.x-startX)/2||1,ry=Math.abs(pos.y-startY)/2||1;strokes.push({type:"circle",color:strokeColor,width:strokeW,cx:cx,cy:cy,rx:rx,ry:ry});}redraw();},{passive:false});
function undoLast(){if(strokes.length>0){strokes.pop();redraw();}}
function clearCanvas(){if(confirm("Clear all?"))strokes=[];redraw();}
function savePNG(){var off=document.createElement("canvas");off.width=canvas.width;off.height=canvas.height;var oc=off.getContext("2d");oc.fillStyle="#fff";oc.fillRect(0,0,off.width,off.height);oc.drawImage(canvas,0,0);var a=document.createElement("a");a.download="cs-test-notes.png";a.href=off.toDataURL();a.click();}

window.addEventListener("resize",resizeCanvas);
resizeCanvas();
initQuiz();
</script>
