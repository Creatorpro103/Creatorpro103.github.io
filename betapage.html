<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Beta | iPrint Keychains</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect fill='%238B5FBF' width='100' height='100' rx='20'/><text x='50' y='68' font-size='58' font-weight='700' fill='white' text-anchor='middle' font-family='Arial'>I</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root { --kraft:#ECE0C8; --ink:#2B2012; --face:#FFFDF7; --rare:#3E7CB1; --ink-soft:rgba(43,32,18,0.66); }
* { margin:0; padding:0; box-sizing:border-box; }
body { min-height:100vh; display:flex; flex-direction:column; background:var(--kraft); color:var(--ink); font-family:'Inter',sans-serif; line-height:1.6; }
nav { padding:26px 24px; max-width:1120px; width:100%; margin:0 auto; }
.wordmark { display:inline-flex; align-items:center; gap:10px; font-size:1.2rem; text-decoration:none; color:inherit; }
.logo-dot { width:20px; height:26px; border-radius:4px; background:var(--rare); border:2.5px solid var(--ink); }
main { flex:1; display:flex; align-items:center; justify-content:center; padding:10px 20px 80px; }
.card { width:100%; max-width:480px; background:var(--face); border:3px solid var(--ink); border-radius:16px; box-shadow:6px 6px 0 rgba(43,32,18,0.3); padding:44px 32px 40px; text-align:center; }
.tag { display:inline-block; font-size:12px; font-weight:700; letter-spacing:1px; text-transform:uppercase; border:2px solid var(--ink); border-radius:999px; padding:4px 12px; margin-bottom:20px; }
h1 { font-family:'Anton',sans-serif; font-weight:400; font-size:2.4rem; line-height:1.15; text-transform:uppercase; letter-spacing:0.01em; margin-bottom:12px; }
p { color:var(--ink-soft); max-width:36ch; margin:0 auto 26px; }
.btn { display:inline-block; text-decoration:none; font-weight:700; font-size:1rem; padding:14px 28px; border-radius:10px; border:2.5px solid var(--ink); background:var(--rare); color:var(--face); box-shadow:4px 4px 0 var(--ink); transition:transform .15s ease, box-shadow .15s ease; }
.btn:hover { transform:translate(-2px,-2px); box-shadow:6px 6px 0 var(--ink); }
.btn:active { transform:translate(1px,1px); box-shadow:2px 2px 0 var(--ink); }
.btn:focus-visible { outline:3px solid var(--rare); outline-offset:3px; }
@media (max-width:480px) { h1 { font-size:2rem; } .card { padding:34px 22px 32px; } }
</style>
</head>
<body>
<nav><a class="wordmark" href="/"><span class="logo-dot"></span>iPrint Keychains</a></nav>
<main>
  <div class="card">
    <span class="tag">Beta</span>
    <h1>No new updates right now</h1>
    <p>There is nothing new to test at the moment. Check back later.</p>
    <a class="btn" href="/">Go back to the main page</a>
  </div>
</main>
</body>
</html>
