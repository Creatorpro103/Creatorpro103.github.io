<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact Us - iPrint Keychains</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect fill='%238B5FBF' width='100' height='100' rx='20'/><text x='50' y='68' font-size='58' font-weight='700' fill='white' text-anchor='middle' font-family='Arial'>I</text></svg>">
<meta name="description" content="Get in touch with iPrint Keychains, questions about an order, bulk pricing, or anything else.">

<script>
window.onRecaptchaLoad = function() { if (window.ensureCaptcha) window.ensureCaptcha(); };
</script>
<script src="https://www.google.com/recaptcha/api.js?onload=onRecaptchaLoad&render=explicit" async defer></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root {
    --kraft: #ECE0C8;
    --kraft-line: rgba(43,32,18,0.14);
    --ink: #2B2012;
    --ink-soft: rgba(43,32,18,0.66);
    --face: #FFFDF7;
    --rare: #3E7CB1;
    --gold: #C9971F;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
    font-family: 'Inter', sans-serif;
    background: var(--kraft);
    color: var(--ink);
    line-height: 1.6;
    min-height: 100vh;
}

h1, h2 { font-family: 'Anton', sans-serif; font-weight: 400; letter-spacing: 0.01em; }
a { color: inherit; }

nav.top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    max-width: 640px;
    margin: 0 auto;
    padding: 26px 24px;
}

.wordmark { display: flex; align-items: center; gap: 10px; font-size: 1.2rem; }
.logo-dot { width: 20px; height: 26px; border-radius: 4px; background: var(--rare); border: 2.5px solid var(--ink); }

.navlink { text-decoration: none; font-weight: 600; font-size: 0.95rem; border-bottom: 2px solid transparent; }
.navlink:hover { border-color: var(--ink); }

.wrap { max-width: 640px; margin: 0 auto; padding: 10px 24px 60px; }

header.hero {
    padding: 10px 0 36px;
    border-bottom: 2px solid var(--ink);
    margin-bottom: 32px;
}

header.hero h1 { font-size: clamp(2rem, 5vw, 2.8rem); text-transform: uppercase; }
header.hero p { color: var(--ink-soft); margin-top: 10px; max-width: 48ch; }

.card {
    background: var(--face);
    border: 1px solid var(--kraft-line);
    border-radius: 14px;
    padding: 26px 24px 28px;
}

.field { margin-bottom: 18px; }
.field label { display: block; font-weight: 700; font-size: 0.88rem; margin-bottom: 6px; }

.field input[type="text"],
.field input[type="email"],
.field textarea {
    width: 100%;
    padding: 11px 13px;
    border: 2px solid var(--kraft-line);
    border-radius: 8px;
    font-family: 'Inter', sans-serif;
    font-size: 0.95rem;
    background: var(--face);
    color: var(--ink);
}

.field textarea { min-height: 130px; resize: vertical; }

.submit-btn {
    width: 100%;
    background: var(--rare);
    color: var(--face);
    border: 2.5px solid var(--ink);
    border-radius: 10px;
    padding: 14px;
    font-weight: 700;
    font-size: 1rem;
    cursor: pointer;
    font-family: 'Inter', sans-serif;
}

.opt { font-weight: 500; color: var(--ink-soft); }

.drop {
    border: 2px dashed rgba(43,32,18,0.35);
    border-radius: 10px;
    background: var(--kraft);
    padding: 20px 16px;
    text-align: center;
    cursor: pointer;
    font-size: 0.92rem;
    font-weight: 600;
    transition: background .15s ease, border-color .15s ease;
}
.drop small { display: block; margin-top: 4px; font-weight: 500; font-size: 0.78rem; color: var(--ink-soft); }
.drop u { text-decoration-thickness: 2px; text-underline-offset: 3px; }
.drop:hover, .drop.over { background: #E6D8BC; border-color: var(--rare); }
.drop:focus-visible { outline: 3px solid var(--rare); outline-offset: 3px; }
.drop.full { opacity: .55; cursor: not-allowed; }

.thumbs { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 10px; margin-top: 12px; }
.thumbs:empty { display: none; }
.thumb { position: relative; aspect-ratio: 1; border: 2px solid var(--ink); border-radius: 10px; overflow: hidden; background: var(--kraft); }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.thumb.busy::after { content: ""; position: absolute; inset: 0; background: rgba(255,253,247,.7); }
.thumb .x {
    position: absolute; top: 4px; right: 4px; z-index: 2;
    width: 24px; height: 24px; border-radius: 50%;
    border: 2px solid var(--ink); background: var(--face); color: var(--ink);
    font-weight: 800; font-size: 14px; line-height: 1; cursor: pointer; padding: 0;
}
.thumb .x:hover { background: var(--gold); }
.thumb .x:focus-visible { outline: 3px solid var(--rare); outline-offset: 2px; }
.file-msg { font-size: 0.8rem; color: var(--ink-soft); margin-top: 8px; min-height: 1.1em; }
.file-msg.err { color: #A33; font-weight: 600; }

.captcha-field { overflow: hidden; }
.captcha-field > div { transform-origin: 0 0; }

.submit-btn:disabled { opacity: 0.6; cursor: not-allowed; }

.status-msg {
    display: none;
    border-radius: 8px;
    padding: 11px 14px;
    font-size: 0.88rem;
    margin-bottom: 16px;
    border: 2px solid var(--ink);
}

.status-msg.error { display: block; background: #F8E3E1; }
.status-msg.success { display: block; background: #E4F0E7; }

footer {
    border-top: 3px solid var(--ink);
    padding: 32px 24px 44px;
    text-align: center;
    font-size: 0.85rem;
    color: var(--ink-soft);
}

.footer-link {
    text-decoration: none;
    color: var(--ink-soft);
    font-weight: 600;
    border-bottom: 2px solid transparent;
}

.footer-link:hover { border-color: var(--ink-soft); }
</style>
</head>
<body>

<nav class="top">
    <div class="wordmark"><span class="logo-dot"></span>iPrint Keychains</div>
    <a class="navlink" href="https://isaacneal.com">Back home</a>
</nav>

<div class="wrap">
    <header class="hero">
        <h1>Contact Us</h1>
        <p>Questions about an order, bulk pricing, or anything else, send a message and I'll get back to you.</p>
    </header>

    <div class="card">
        <div class="status-msg" id="status"></div>
        <form id="contact-form">
            <div class="field">
                <label for="c-name">Your name</label>
                <input type="text" id="c-name" required>
            </div>
            <div class="field">
                <label for="c-email">Your email</label>
                <input type="email" id="c-email" required>
            </div>
            <div class="field">
                <label for="c-message">Message</label>
                <textarea id="c-message" required></textarea>
            </div>
            <div class="field">
                <label for="c-files">Photos <span class="opt">(optional, up to 4)</span></label>
                <div class="drop" id="drop" tabindex="0" role="button" aria-label="Add photos. Drop images here or choose files.">
                    Drop images here or <u>choose files</u>
                    <small>Photos and screenshots work. Large photos are resized automatically.</small>
                </div>
                <input type="file" id="c-files" accept="image/*" multiple hidden>
                <div class="thumbs" id="thumbs"></div>
                <div class="file-msg" id="file-msg" role="status"></div>
            </div>
            <div class="field captcha-field"><div id="recaptcha-box"></div></div>
            <button type="submit" class="submit-btn" id="submit-btn">Send Message</button>
        </form>
    </div>
</div>

<footer>
    <a class="footer-link" href="https://isaacneal.com">Home</a>
    &middot;
    <a class="footer-link" href="testimonials">Testimonials</a>
    &middot;
    <a class="footer-link" href="updates">Update Logs</a>
</footer>

<script>
// One script now checks the reCAPTCHA token AND emails the message with any attached photos.
// This must be the deployment of ContactCode.gs (the script with the reCAPTCHA secret).
const CONTACT_API_URL = "https://script.google.com/macros/s/AKfycbysYi7kmgIx6iFL_vSlPQUJ1pxUSUsPKTtWpQspU_P_Rgo3XpZB-okI970f0qjjhntV3A/exec";

// Photo limits (the script enforces the same limits again).
const MAX_FILES = 4;
const MAX_PICK_BYTES = 25 * 1024 * 1024;   // largest original photo we will even try to read
const MAX_SIDE = 1600;                     // photos are scaled down to this many pixels on the long side
const JPEG_QUALITY = 0.82;
const MAX_SEND_BYTES = 9 * 1024 * 1024;    // all photos together, after resizing

const RECAPTCHA_SITE_KEY = "6Ldio-ctAAAAAMrlHN-HKv2LE8O5QZ55akxkEn4I";
let captchaWidgetId = null;

function fitCaptcha() {
  const box = document.getElementById('recaptcha-box');
  const wrap = box.parentElement;
  const avail = wrap.clientWidth;
  const scale = avail > 0 && avail < 304 ? avail / 304 : 1;
  box.style.transform = scale < 1 ? 'scale(' + scale + ')' : '';
  wrap.style.height = scale < 1 ? Math.ceil(78 * scale) + 'px' : '';
}

window.ensureCaptcha = function() {
  if (captchaWidgetId !== null || !window.grecaptcha || !grecaptcha.render) return;
  captchaWidgetId = grecaptcha.render('recaptcha-box', { sitekey: RECAPTCHA_SITE_KEY });
  fitCaptcha();
};
window.addEventListener('resize', fitCaptcha);
if (window.grecaptcha && grecaptcha.render) window.ensureCaptcha();

function resetCaptcha() {
  try { if (captchaWidgetId !== null) grecaptcha.reset(captchaWidgetId); } catch (err) {}
}

const form = document.getElementById('contact-form');
const status = document.getElementById('status');
const submitBtn = document.getElementById('submit-btn');

// ---------- photo attachments ----------
const drop = document.getElementById('drop');
const fileInput = document.getElementById('c-files');
const thumbs = document.getElementById('thumbs');
const fileMsg = document.getElementById('file-msg');
let photos = [];          // { id, name, b64, mime, bytes, url, ready }
let nextId = 1;

function say(msg, isErr) { fileMsg.textContent = msg || ''; fileMsg.className = 'file-msg' + (isErr ? ' err' : ''); }
function stripExt(n) { return String(n || 'photo').replace(/\.[^.]*$/, ''); }
function readB64(blob) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(String(r.result).split(',')[1] || '');
    r.onerror = () => reject(new Error('read'));
    r.readAsDataURL(blob);
  });
}

// Scales a photo down and turns it into a JPEG. If the browser can't read the image
// (for example some iPhone HEIC files), a small original is sent as it is.
async function prepare(file) {
  try {
    const bmp = await createImageBitmap(file);
    const scale = Math.min(1, MAX_SIDE / Math.max(bmp.width, bmp.height));
    const w = Math.max(1, Math.round(bmp.width * scale)), h = Math.max(1, Math.round(bmp.height * scale));
    const canvas = document.createElement('canvas');
    canvas.width = w; canvas.height = h;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h);   // so transparent PNGs don't turn black
    ctx.drawImage(bmp, 0, 0, w, h);
    if (bmp.close) bmp.close();
    const blob = await new Promise(res => canvas.toBlob(res, 'image/jpeg', JPEG_QUALITY));
    if (!blob) throw new Error('encode');
    return { blob, mime: 'image/jpeg', name: stripExt(file.name) + '.jpg' };
  } catch (err) {
    if (file.size <= 4 * 1024 * 1024) return { blob: file, mime: file.type || 'image/jpeg', name: file.name };
    throw new Error("Couldn't read " + (file.name || 'that image') + '. Try a JPG or PNG.');
  }
}

function refreshDrop() { drop.classList.toggle('full', photos.length >= MAX_FILES); }

function renderThumb(p) {
  const el = document.createElement('div');
  el.className = 'thumb busy'; el.dataset.id = p.id;
  const img = document.createElement('img'); img.alt = ''; img.src = p.url;
  const x = document.createElement('button');
  x.type = 'button'; x.className = 'x'; x.textContent = '\u00d7'; x.setAttribute('aria-label', 'Remove ' + p.name);
  x.addEventListener('click', () => removePhoto(p.id));
  el.appendChild(img); el.appendChild(x);
  thumbs.appendChild(el);
  return el;
}

function removePhoto(id) {
  const p = photos.find(q => q.id === id);
  if (p && p.url) URL.revokeObjectURL(p.url);
  photos = photos.filter(q => q.id !== id);
  const el = thumbs.querySelector('[data-id="' + id + '"]');
  if (el) el.remove();
  refreshDrop();
  say('');
}

async function addFiles(fileList) {
  const files = Array.from(fileList || []);
  say('');
  for (const file of files) {
    if (photos.length >= MAX_FILES) { say('You can attach up to ' + MAX_FILES + ' photos.', true); break; }
    if (!/^image\//.test(file.type) && !/\.(heic|heif|jpe?g|png|gif|webp)$/i.test(file.name || '')) { say('Only images can be attached.', true); continue; }
    if (file.size > MAX_PICK_BYTES) { say((file.name || 'That image') + ' is too large.', true); continue; }
    const p = { id: nextId++, name: file.name || 'photo', ready: false, url: URL.createObjectURL(file) };
    photos.push(p);
    const el = renderThumb(p);
    refreshDrop();
    try {
      const out = await prepare(file);
      p.b64 = await readB64(out.blob);
      p.mime = out.mime; p.name = out.name; p.bytes = out.blob.size; p.ready = true;
      el.classList.remove('busy');
    } catch (err) {
      removePhoto(p.id);
      say(err.message || "Couldn't read that image.", true);
    }
  }
  fileInput.value = '';
}

drop.addEventListener('click', () => { if (photos.length < MAX_FILES) fileInput.click(); });
drop.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); drop.click(); } });
fileInput.addEventListener('change', () => addFiles(fileInput.files));
['dragenter', 'dragover'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('over'); }));
['dragleave', 'drop'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('over'); }));
drop.addEventListener('drop', e => addFiles(e.dataTransfer && e.dataTransfer.files));
// Pasting a screenshot into the message box works too.
document.getElementById('c-message').addEventListener('paste', e => {
  const items = (e.clipboardData && e.clipboardData.files) || [];
  if (items.length) { addFiles(items); }
});

function clearPhotos() {
  photos.forEach(p => p.url && URL.revokeObjectURL(p.url));
  photos = []; thumbs.innerHTML = ''; refreshDrop(); say('');
}

// ---------- send ----------
form.addEventListener('submit', e => {
  e.preventDefault();
  status.className = 'status-msg';
  status.textContent = '';

  if (photos.some(p => !p.ready)) {
    status.textContent = 'Your photos are still getting ready. Try again in a moment.';
    status.className = 'status-msg error';
    return;
  }
  const total = photos.reduce((n, p) => n + p.bytes, 0);
  if (total > MAX_SEND_BYTES) {
    status.textContent = 'Your photos are too large together. Remove one and try again.';
    status.className = 'status-msg error';
    return;
  }

  let captchaToken = '';
  try { if (captchaWidgetId !== null) captchaToken = grecaptcha.getResponse(captchaWidgetId); } catch (err) {}
  if (!captchaToken) {
    status.textContent = captchaWidgetId === null
      ? "The spam check didn't load. Refresh the page and try again."
      : 'Please check the "I\'m not a robot" box before sending.';
    status.className = 'status-msg error';
    return;
  }

  submitBtn.disabled = true;
  submitBtn.textContent = 'Sending message...';

  const payload = {
    name: document.getElementById('c-name').value,
    email: document.getElementById('c-email').value,
    message: document.getElementById('c-message').value,
    recaptchaToken: captchaToken,
    attachments: photos.map(p => ({ name: p.name, type: p.mime, data: p.b64 }))
  };

  fetch(CONTACT_API_URL, { method: 'POST', body: JSON.stringify(payload) })
    .then(res => res.json())
    .then(data => {
      resetCaptcha();
      submitBtn.disabled = false;
      submitBtn.textContent = 'Send Message';

      if (!data.success) {
        status.textContent = data.error || 'Something went wrong. Try again.';
        status.className = 'status-msg error';
        return;
      }

      status.textContent = "Message sent! I'll get back to you soon.";
      status.className = 'status-msg success';
      form.reset();
      clearPhotos();
    })
    .catch(() => {
      resetCaptcha();
      submitBtn.disabled = false;
      submitBtn.textContent = 'Send Message';
      status.textContent = "Couldn't reach the server. Check your connection and try again.";
      status.className = 'status-msg error';
    });
});
</script>

</body>
</html>
