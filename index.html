<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chaos Button</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      transition: filter 0.3s ease;
    }

    body.inverted {
      filter: invert(1) hue-rotate(180deg);
    }

    .chaos-container {
      position: relative;
      width: 100%;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .button-wrapper {
      position: relative;
      z-index: 100;
    }

    .chaos-button {
      width: 200px;
      height: 200px;
      border-radius: 50%;
      background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
      border: none;
      color: white;
      font-size: 24px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
      transition: all 0.2s;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .chaos-button:hover {
      transform: scale(1.05);
      box-shadow: 0 15px 50px rgba(0, 0, 0, 0.4);
    }

    .chaos-button:active {
      transform: scale(0.95);
    }

    .floating-duck {
      position: fixed;
      font-size: 60px;
      pointer-events: none;
      user-select: none;
      animation: float 3s ease-in-out infinite;
      z-index: 50;
    }

    @keyframes float {
      0%, 100% {
        transform: translateY(0px) rotate(0deg);
      }
      50% {
        transform: translateY(-30px) rotate(5deg);
      }
    }

    .running-cursor {
      position: fixed;
      font-size: 40px;
      pointer-events: none;
      z-index: 50;
      animation: run 0.5s steps(4, end) infinite;
    }

    @keyframes run {
      0% { transform: scaleX(1); }
      50% { transform: scaleX(1); }
      100% { transform: scaleX(1); }
    }

    .falling-object {
      position: fixed;
      pointer-events: none;
      font-size: 40px;
      animation: fall linear forwards;
      z-index: 40;
    }

    @keyframes fall {
      to {
        transform: translateY(100vh) rotate(360deg);
      }
    }

    .shake {
      animation: shake 0.3s;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      10%, 30%, 50%, 70%, 90% { transform: translateX(-5px); }
      20%, 40%, 60%, 80% { transform: translateX(5px); }
    }

    .fake-popup {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: white;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      z-index: 200;
      max-width: 400px;
      text-align: center;
      animation: popupAppear 0.3s ease;
    }

    @keyframes popupAppear {
      from {
        opacity: 0;
        transform: translate(-50%, -50%) scale(0.8);
      }
      to {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1);
      }
    }

    .popup-title {
      font-size: 24px;
      font-weight: bold;
      color: #333;
      margin-bottom: 15px;
    }

    .popup-message {
      font-size: 14px;
      color: #666;
      margin-bottom: 25px;
      line-height: 1.6;
    }

    .popup-buttons {
      display: flex;
      gap: 10px;
      justify-content: center;
    }

    .popup-button {
      padding: 10px 20px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s;
    }

    .popup-ok {
      background: #667eea;
      color: white;
    }

    .popup-ok:hover {
      background: #764ba2;
      transform: translateY(-2px);
    }

    .popup-cancel {
      background: #f0f0f0;
      color: #333;
    }

    .popup-cancel:hover {
      background: #e0e0e0;
    }

    .popup-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      z-index: 150;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .text-effect {
      position: fixed;
      font-size: 48px;
      font-weight: bold;
      color: #fff;
      pointer-events: none;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
      animation: textFloat 2s ease-out forwards;
      z-index: 50;
    }

    @keyframes textFloat {
      0% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
      100% {
        opacity: 0;
        transform: translateY(-100px) scale(1.2);
      }
    }

    .explosion {
      position: fixed;
      pointer-events: none;
      animation: explode 0.6s ease-out forwards;
      z-index: 50;
    }

    @keyframes explode {
      0% {
        opacity: 1;
        transform: scale(0);
      }
      100% {
        opacity: 0;
        transform: scale(1);
      }
    }

    .emoji-rain {
      position: fixed;
      font-size: 50px;
      pointer-events: none;
      animation: rain linear forwards;
      z-index: 40;
    }

    @keyframes rain {
      to {
        transform: translateY(100vh);
        opacity: 0;
      }
    }

    .particle {
      position: fixed;
      pointer-events: none;
      border-radius: 50%;
      animation: particle-move 1s ease-out forwards;
      z-index: 40;
    }

    @keyframes particle-move {
      to {
        opacity: 0;
        transform: translate(var(--tx), var(--ty)) scale(0);
      }
    }

    .status-text {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      color: white;
      font-size: 16px;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
      z-index: 80;
      animation: fadeInOut 2s ease;
    }

    @keyframes fadeInOut {
      0% { opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { opacity: 0; }
    }

    .confetti {
      position: fixed;
      pointer-events: none;
      animation: confetti-fall 3s linear forwards;
      z-index: 40;
    }

    @keyframes confetti-fall {
      to {
        transform: translateY(100vh) rotateZ(720deg);
        opacity: 0;
      }
    }

    .glitch {
      animation: glitch 0.3s;
    }

    @keyframes glitch {
      0% { text-shadow: 2px 0 #ff006e, -2px 0 #00d4ff; }
      25% { text-shadow: -2px 0 #ff006e, 2px 0 #00d4ff; }
      50% { text-shadow: 2px 0 #00d4ff, -2px 0 #ff006e; }
      75% { text-shadow: -2px 0 #00d4ff, 2px 0 #ff006e; }
      100% { text-shadow: none; }
    }

    .message-display {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 72px;
      font-weight: bold;
      color: white;
      text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.5);
      pointer-events: none;
      z-index: 100;
      text-align: center;
      animation: messageFloat 1.5s ease-out forwards;
    }

    @keyframes messageFloat {
      0% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(0);
      }
      50% {
        opacity: 1;
      }
      100% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(1.2);
      }
    }
  </style>
</head>
<body>
  <div class="chaos-container">
    <div class="button-wrapper">
      <button class="chaos-button">CHAOS</button>
    </div>
  </div>

  <script>
    const button = document.querySelector('.chaos-button');
    let clickCount = 0;
    let gravityActive = false;
    let invertActive = false;
    let duckSpawned = false;

    const effects = [
      shake,
      gravity,
      spawnDucks,
      cursorRunaway,
      fakePopup,
      invertColors,
      explosion,
      emojiRain,
      confetti,
      glitchText,
      floatingText,
      bounce,
      spinPage,
      particles,
      soundEffect,
      flashScreen,
      randomText,
      slowMo,
      bounceButton,
      screenWobble
    ];

    function shake() {
      document.body.classList.add('shake');
      setTimeout(() => document.body.classList.remove('shake'), 300);
      showStatus('SHAKEN!');
    }

    function gravity() {
      if (gravityActive) return;
      gravityActive = true;
      
      const elements = document.querySelectorAll('*');
      elements.forEach(el => {
        if (el.classList.contains('chaos-button')) return;
        let vx = (Math.random() - 0.5) * 4;
        let vy = 0;
        let x = el.getBoundingClientRect().left;
        let y = el.getBoundingClientRect().top;

        const fall = setInterval(() => {
          vy += 0.2;
          y += vy;
          x += vx;

          if (y > window.innerHeight) {
            clearInterval(fall);
          }

          el.style.position = 'fixed';
          el.style.left = x + 'px';
          el.style.top = y + 'px';
          el.style.pointerEvents = 'none';
        }, 30);
      });

      showStatus('GRAVITY ON!');
      setTimeout(() => {
        gravityActive = false;
      }, 3000);
    }

    function spawnDucks() {
      const duckCount = Math.floor(Math.random() * 3) + 5;
      const ducks = ['🦆', '🦢', '🦅', '🐦', '🦉'];

      for (let i = 0; i < duckCount; i++) {
        const duck = document.createElement('div');
        duck.className = 'floating-duck';
        duck.textContent = ducks[Math.floor(Math.random() * ducks.length)];
        duck.style.left = Math.random() * 90 + 5 + '%';
        duck.style.top = Math.random() * 80 + 10 + '%';
        duck.style.animationDelay = Math.random() * 2 + 's';
        document.body.appendChild(duck);

        setTimeout(() => duck.remove(), 4000);
      }

      showStatus('DUCKS!');
    }

    function cursorRunaway() {
      const runningEmoji = '🏃';
      const runner = document.createElement('div');
      runner.className = 'running-cursor';
      runner.textContent = runningEmoji;
      runner.style.left = Math.random() * 80 + 10 + '%';
      runner.style.top = Math.random() * 80 + 10 + '%';
      document.body.appendChild(runner);

      const targetX = Math.random() * (window.innerWidth - 50);
      const targetY = Math.random() * (window.innerHeight - 50);
      const startX = parseFloat(runner.style.left);
      const startY = parseFloat(runner.style.top);
      let progress = 0;

      const moveInterval = setInterval(() => {
        progress += 0.05;
        const x = startX + (targetX - startX) * progress;
        const y = startY + (targetY - startY) * progress;
        runner.style.left = x + 'px';
        runner.style.top = y + 'px';

        if (progress >= 1) {
          clearInterval(moveInterval);
          setTimeout(() => runner.remove(), 500);
        }
      }, 30);

      showStatus('RUNNING AWAY!');
    }

    function fakePopup() {
      const overlay = document.createElement('div');
      overlay.className = 'popup-overlay';
      document.body.appendChild(overlay);

      const popup = document.createElement('div');
      popup.className = 'fake-popup';

      const messages = [
        { title: 'Congratulations!', message: 'You won a free iPhone! Click OK to claim.' },
        { title: 'Warning!', message: 'Your computer is infected! Click OK to continue.' },
        { title: 'SYSTEM ALERT', message: 'RAM low. Click OK to optimize.' },
        { title: 'Update Available', message: 'Click OK to update your browser.' },
        { title: 'Security Notice', message: 'Unusual activity detected. Click OK to proceed.' }
      ];

      const msg = messages[Math.floor(Math.random() * messages.length)];
      popup.innerHTML = `
        <div class="popup-title">${msg.title}</div>
        <div class="popup-message">${msg.message}</div>
        <div class="popup-buttons">
          <button class="popup-button popup-ok">OK</button>
          <button class="popup-button popup-cancel">Cancel</button>
        </div>
      `;

      document.body.appendChild(popup);

      popup.querySelector('.popup-ok').addEventListener('click', () => {
        overlay.remove();
        popup.remove();
      });

      popup.querySelector('.popup-cancel').addEventListener('click', () => {
        overlay.remove();
        popup.remove();
      });

      showStatus('FAKE POPUP!');
    }

    function invertColors() {
      invertActive = !invertActive;
      document.body.classList.toggle('inverted');
      showStatus(invertActive ? 'INVERTED!' : 'NORMAL!');
    }

    function explosion() {
      const centerX = window.innerWidth / 2;
      const centerY = window.innerHeight / 2;

      for (let i = 0; i < 20; i++) {
        const particle = document.createElement('div');
        particle.className = 'particle';
        const size = Math.random() * 20 + 10;
        particle.style.width = size + 'px';
        particle.style.height = size + 'px';
        particle.style.background = `hsl(${Math.random() * 360}, 100%, 50%)`;
        particle.style.left = centerX + 'px';
        particle.style.top = centerY + 'px';

        const angle = (i / 20) * Math.PI * 2;
        const distance = 200;
        const tx = Math.cos(angle) * distance;
        const ty = Math.sin(angle) * distance;
        particle.style.setProperty('--tx', tx + 'px');
        particle.style.setProperty('--ty', ty + 'px');

        document.body.appendChild(particle);
        setTimeout(() => particle.remove(), 1000);
      }

      showStatus('BOOM!');
    }

    function emojiRain() {
      const emojis = ['⭐', '💫', '✨', '🌟', '💥', '🎉', '🎊', '🍕', '🎮', '🚀'];
      const rainCount = 30;

      for (let i = 0; i < rainCount; i++) {
        const rain = document.createElement('div');
        rain.className = 'emoji-rain';
        rain.textContent = emojis[Math.floor(Math.random() * emojis.length)];
        rain.style.left = Math.random() * 100 + '%';
        rain.style.top = '-50px';
        rain.style.animationDuration = (Math.random() * 2 + 2) + 's';
        document.body.appendChild(rain);

        setTimeout(() => rain.remove(), 3000);
      }

      showStatus('RAINING EMOJIS!');
    }

    function confetti() {
      const confettiPieces = 50;
      const colors = ['#667eea', '#764ba2', '#f093fb', '#f5576c', '#4facfe', '#00f2fe'];

      for (let i = 0; i < confettiPieces; i++) {
        const piece = document.createElement('div');
        piece.className = 'confetti';
        piece.style.left = Math.random() * 100 + '%';
        piece.style.top = '-10px';
        piece.style.width = Math.random() * 10 + 5 + 'px';
        piece.style.height = Math.random() * 10 + 5 + 'px';
        piece.style.background = colors[Math.floor(Math.random() * colors.length)];
        piece.style.animationDuration = (Math.random() * 2 + 2) + 's';
        piece.style.animationDelay = Math.random() * 0.5 + 's';
        document.body.appendChild(piece);

        setTimeout(() => piece.remove(), 4000);
      }

      showStatus('CONFETTI!');
    }

    function glitchText() {
      const button = document.querySelector('.chaos-button');
      button.classList.add('glitch');
      const originalText = button.textContent;
      button.textContent = 'GLITCH';

      setTimeout(() => {
        button.classList.remove('glitch');
        button.textContent = originalText;
      }, 300);

      showStatus('GLITCHED!');
    }

    function floatingText() {
      const texts = ['WOW!', 'AWESOME!', 'CRAZY!', 'YOLO!', 'EPIC!', 'WILD!', 'INTENSE!'];
      const text = document.createElement('div');
      text.className = 'message-display';
      text.textContent = texts[Math.floor(Math.random() * texts.length)];
      document.body.appendChild(text);

      setTimeout(() => text.remove(), 1500);
      showStatus('TEXT FLOATED!');
    }

    function bounce() {
      const button = document.querySelector('.chaos-button');
      button.style.animation = 'bounce 0.5s';
      setTimeout(() => button.style.animation = '', 500);
      showStatus('BOUNCED!');
    }

    function spinPage() {
      document.body.style.animation = 'spin 1s ease-in-out';
      setTimeout(() => document.body.style.animation = '', 1000);
      showStatus('SPINNING!');
    }

    function particles() {
      const centerX = window.innerWidth / 2;
      const centerY = window.innerHeight / 2;

      for (let i = 0; i < 15; i++) {
        const particle = document.createElement('div');
        particle.className = 'particle';
        particle.style.width = '8px';
        particle.style.height = '8px';
        particle.style.background = '#fff';
        particle.style.left = centerX + 'px';
        particle.style.top = centerY + 'px';

        const angle = (i / 15) * Math.PI * 2;
        const distance = 150;
        const tx = Math.cos(angle) * distance;
        const ty = Math.sin(angle) * distance;
        particle.style.setProperty('--tx', tx + 'px');
        particle.style.setProperty('--ty', ty + 'px');

        document.body.appendChild(particle);
        setTimeout(() => particle.remove(), 1000);
      }

      showStatus('PARTICLES!');
    }

    function soundEffect() {
      // Create a simple beep sound using Web Audio API
      const audioContext = new (window.AudioContext || window.webkitAudioContext)();
      const oscillator = audioContext.createOscillator();
      const gainNode = audioContext.createGain();

      oscillator.connect(gainNode);
      gainNode.connect(audioContext.destination);

      oscillator.frequency.value = 400 + Math.random() * 200;
      oscillator.type = 'sine';

      gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
      gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.2);

      oscillator.start(audioContext.currentTime);
      oscillator.stop(audioContext.currentTime + 0.2);

      showStatus('BEEP!');
    }

    function flashScreen() {
      const overlay = document.createElement('div');
      overlay.style.position = 'fixed';
      overlay.style.top = '0';
      overlay.style.left = '0';
      overlay.style.width = '100%';
      overlay.style.height = '100%';
      overlay.style.background = 'white';
      overlay.style.zIndex = '999';
      overlay.style.animation = 'fadeInOut 0.3s ease';
      overlay.style.pointerEvents = 'none';
      document.body.appendChild(overlay);

      setTimeout(() => overlay.remove(), 300);
      showStatus('FLASH!');
    }

    function randomText() {
      const textArray = [
        'YOU CLICKED!',
        'CHAOS REIGNS!',
        'ERROR 404',
        'PRESS ANY KEY',
        'WHAT DID YOU DO?',
        'THIS IS FINE',
        'LOL',
        'NOICE'
      ];

      const text = document.createElement('div');
      text.className = 'text-effect';
      text.textContent = textArray[Math.floor(Math.random() * textArray.length)];
      text.style.left = Math.random() * 80 + 10 + '%';
      text.style.top = Math.random() * 80 + 10 + '%';
      text.style.color = `hsl(${Math.random() * 360}, 100%, 50%)`;
      document.body.appendChild(text);

      setTimeout(() => text.remove(), 2000);
      showStatus('TEXT!');
    }

    function slowMo() {
      document.body.style.animationPlayState = 'paused';
      showStatus('SLOW MO!');
      setTimeout(() => {
        document.body.style.animationPlayState = 'running';
      }, 1000);
    }

    function bounceButton() {
      const button = document.querySelector('.chaos-button');
      const startY = button.offsetTop;
      let y = startY;
      let vy = -15;

      const bounce = setInterval(() => {
        vy += 0.5;
        y += vy;

        button.style.position = 'relative';
        button.style.top = (y - startY) + 'px';

        if (y > startY && vy > 0) {
          clearInterval(bounce);
          button.style.top = '0';
        }
      }, 20);

      showStatus('BOUNCY!');
    }

    function screenWobble() {
      document.documentElement.style.animation = 'wobble 0.4s ease-in-out';
      setTimeout(() => document.documentElement.style.animation = '', 400);
      showStatus('WOBBLED!');
    }

    function showStatus(text) {
      const status = document.createElement('div');
      status.className = 'status-text';
      status.textContent = text;
      document.body.appendChild(status);
      setTimeout(() => status.remove(), 2000);
    }

    // Add wobble keyframe
    const style = document.createElement('style');
    style.textContent = `
      @keyframes bounce {
        0% { transform: translateY(0); }
        100% { transform: translateY(0); }
      }
      @keyframes spin {
        0% { transform: rotateZ(0deg); }
        50% { transform: rotateZ(180deg); }
        100% { transform: rotateZ(360deg); }
      }
      @keyframes wobble {
        0%, 100% { transform: skewX(0deg); }
        25% { transform: skewX(5deg); }
        75% { transform: skewX(-5deg); }
      }
    `;
    document.head.appendChild(style);

    button.addEventListener('click', () => {
      clickCount++;
      const randomEffect = effects[Math.floor(Math.random() * effects.length)];
      randomEffect();
    });
  </script>
</body>
</html>
