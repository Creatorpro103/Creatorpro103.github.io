ter you find the smallest, what happens next?", "c": ["Delete it", "Sort it separately", "Move it to the first position", "Double it"], "a": 2, "e": "You move the smallest item to the first position (swap it there).", "hint": "Move it to the front."}, {"t": 1, "topic": "Selection Sort", "q": "How many times does Selection Sort search for the smallest?", "c": ["1 time", "2 times", "Many times", "It depends"], "a": 2, "e": "It searches for the smallest many times - once for almost every item in the list.", "hint": "Almost once per item."}, {"t": 1, "topic": "Selection Sort", "q": "Is Selection Sort stable?", "c": ["Yes", "No", "Sometimes", "Only for numbers"], "a": 1, "e": "No, Selection Sort is unstable because swapping can mix up items that are the same.", "hint": "Does swapping mess up equal items?"}, {"t": 1, "topic": "Selection Sort", "q": "What's good about Selection Sort?", "c": ["It's super fast", "It uses very little extra space", "It's easy to understand", "It doesn't need a computer"], "a": 1, "e": "Selection Sort doesn't need extra space - it sorts right in the list.", "hint": "Think about extra memory."}, {"t": 1, "topic": "Selection Sort", "q": "Is Selection Sort fast or slow?", "c": ["Very fast", "Medium", "Slow", "Super fast"], "a": 2, "e": "Selection Sort is slow because it has to search for the smallest item many times.", "hint": "Lots of searching."}, {"t": 1, "topic": "Selection Sort", "q": "Selection Sort [5, 2, 8, 1, 9]. After the first round, what's the list?", "c": ["[1, 5, 2, 8, 9]", "[1, 2, 8, 5, 9]", "[1, 2, 5, 8, 9]", "[5, 1, 2, 8, 9]"], "a": 0, "e": "Find the smallest (1), move it to the front: [1, 5, 2, 8, 9].", "hint": "Only 1 moves to the front."}, {"t": 1, "topic": "Selection Sort", "q": "How many times does Selection Sort swap items in a list of 5?", "c": ["0", "4", "5", "10"], "a": 1, "e": "It swaps 4 times (once for almost every position except the last).", "hint": "Almost one swap per round."}, {"t": 1, "topic": "Insertion Sort", " canvas.addEventListener("pointerdown",e=>{if(tool==="select"||!annotationsEnabled)return;e.preventDefault();isDrawing=true;startX=e.clientX;startY=e.clientY;lastX=e.clientX;lastY=e.clientY;if(tool==="pen"||tool==="highlight")currentPath=[{x:e.clientX,y:e.clientY}];snapShot=ctx.getImageData(0,0,canvas.width,canvas.height);},{passive:false});
canvas.addEventListener("pointermove",e=>{if(!isDrawing)return;e.preventDefault();if(tool==="pen"||tool==="highlight"){currentPath.push({x:e.clientX,y:e.clientY});ctx.save();ctx.strokeStyle=strokeColor;ctx.lineWidth=tool==="highlight"?strokeW*8:strokeW;ctx.globalAlpha=tool==="highlight"?0.3:1;ctx.lineCap="round";ctx.beginPath();ctx.moveTo(lastX,lastY);ctx.lineTo(e.clientX,e.clientY);ctx.stroke();ctx.restore();lastX=e.clientX;lastY=e.clientY;}else{ctx.putImageData(snapShot,0,0);ctx.save();ctx.strokeStyle=strokeColor;ctx.lineWidth=strokeW;if(tool==="line"){ctx.beginPath();ctx.moveTo(startX,startY);ctx.lineTo(e.clientX,e.clientY);ctx.stroke();}else if(tool==="rect"){ctx.strokeRect(Math.min(startX,e.clientX),Math.min(startY,e.clientY),Math.abs(e.clientX-startX),Math.abs(e.clientY-startY));}else if(tool==="circle"){var cx=(startX+e.clientX)/2,cy=(startY+e.clientY)/2;ctx.beginPath();ctx.ellipse(cx,cy,Math.abs(e.clientX-startX)/2,Math.abs(e.clientY-startY)/2,0,0,Math.PI*2);ctx.stroke();}ctx.restore();}},{passive:false});
canvas.addEventListener("pointerup",e=>{if(!isDrawing)return;isDrawing=false;if(tool==="pen"||tool==="highlight"){strokes.push({type:tool,color:strokeColor,width:strokeW,pts:currentPath});currentPath=[];}else if(tool==="line"){strokes.push({type:"line",color:strokeColor,width:strokeW,x1:startX,y1:startY,x2:e.clientX,y2:e.clientY});ctx.putImageData(snapShot,0,0);redraw();}else if(tool==="rect"){strokes.push({type:"rect",color:strokeColor,width:strokeW,x:Math.min(startX,e.clientX),y:Math.min(startY,e.clientY),w:Math.abs(e.clientX-startX),h:Math.abs(e.clientY-startY)});ctx.putImageData(snapShot,0,0);redraw();}else if(tool==="circle"){var cx=(startX+e.clientX)/2,cy=(startY+e.clientY)/2;strokes.push({type:"circle",color:strokeColor,width:strokeW,cx,cy,rx:Math.abs(e.clientX-startX)/2||1,ry:Math.abs(e.clientY-startY)/2||1});ctx.putImageData(snapShot,0,0);redraw();}snapShot=null;},{passive:false});
function undoLast(){if(strokes.length>0){strokes.pop();redraw();}}
function clearCanvas(){if(confirm("Clear?")){strokes=[];redraw();}}
function shuffle(a){var arr=a.slice();for(var i=arr.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=arr[i];arr[i]=arr[j];arr[j]=t;}return arr;}
function initQuiz(){var topics=[...new Set(ALL_QUESTIONS.map(q=>q.topic))].sort();var tf=document.getElementById("topic-filter");topics.forEach(t=>{var o=document.createElement("option");o.value=t;o.textContent=t;tf.appendChild(o);});var ts=document.getElementById("test-selector");["All","Test 1","Test 2","Test 3","Test 4","Test 5"].forEach((l,i)=>{var b=document.createElement("button");b.className="test-btn"+(i===0?" active":"");b.textContent=l;b.onclick=(function(t){return function(){document.querySelectorAll(".test-btn").forEach(x=>x.classList.remove("active"));this.classList.add("active");currentTest=t;};})(i);ts.appendChild(b);});}
function startTest(){var pool=currentTest===0?ALL_QUESTIONS:ALL_QUESTIONS.filter(q=>q.t===currentTest);if(topicFilter!=="all")pool=pool.filter(q=>q.topic===topicFilter);if(pool.length===0){alert("No questions.");return;}activeQuestions=shuffle(pool).slice(0,50);answers=[];for(var i=0;i<activeQuestions.length;i++)answers.push(null);correct=0;wrong=0;currentIndex=0;document.getElementById("view-start").style.display="none";document.getElementById("view-test").style.display="block";document.getElementById("hint-btn").disabled=false;renderQ();}
function renderQ(){var q=activeQuestions[currentIndex],total=activeQuestions.length;document.getElementById("s-cur").textContent=(currentIndex+1)+" / "+total;document.getElementById("s-cor").textContent=correct;document.getElementById("s-wrg").textContent=wrong;var answered=correct+wrong;document.getElementById("s-pct").textContent=answered>0?Math.round(correct/answered*100)+"%":"--";document.getElementById("prog").style.width=(currentIndex/total*100)+"%";document.getElementById("q-num").textContent="Q"+(currentIndex+1);document.getElementById("q-topic").textContent=q.topic;document.getElementById("q-text").textContent=q.q;var choicesEl=document.getElementById("choices");choicesEl.innerHTML="";var prev=answers[currentIndex];q.c.forEach(function(text,i){var btn=document.createElement("button");btn.className="choice";if(prev!==null){btn.classList.add("locked");if(i===q.a)btn.classList.add("correct-ans");else if(i===prev&&prev!==q.a)btn.classList.add("wrong-ans");}var letter=document.createElement("span");letter.className="choice-letter";letter.textContent=String.fromCharCode(65+i)+")";var txt=document.createElement("span");txt.textContent=text;btn.appendChild(letter);btn.appendChild(txt);if(prev===null)(function(idx){btn.onclick=function(){selectAnswer(idx);};})(i);choicesEl.appendChild(btn);});var expEl=document.getElementById("explanation");if(prev!==null){expEl.className="explanation show "+(prev===q.a?"correct-exp":"wrong-exp");document.getElementById("exp-icon").textContent=prev===q.a?"Correct!":"Not quite:";document.getElementById("exp-text").textContent=q.e;}else{expEl.className="explanation";}document.getElementById("btn-back").disabled=currentIndex===0;document.getElementById("btn-next").disabled=prev===null;}
function selectAnswer(i){if(answers[currentIndex]!==null)return;var q=activeQuestions[currentIndex];answers[currentIndex]=i;if(i===q.a)correct++;else wrong++;renderQ();}
function nextQ(){if(currentIndex<activeQuestions.length-1){currentIndex++;renderQ();}else showResults();}
function goBack(){if(currentIndex>0){currentIndex--;renderQ();}}
function finishEarly(){if(confirm("Finish?"))showResults();}
function showHint(){var q=activeQuestions[currentIndex];if(!q.hint)return;var p=document.createElement("div");p.className="hint-popup";p.innerHTML=`<div class="hint-close" onclick="this.parentElement.remove()">×</div><strong>Hint:</strong> ${q.hint}`;document.body.appendChild(p);setTimeout(()=>p.remove(),5000);}
function showResults(){document.getElementById("view-test").style.display="none";document.getElementById("view-results").style.display="block";var total=activeQuestions.length,skipped=total-correct-wrong,pct=total>0?Math.round(correct/total*100):0;document.getElementById("r-score").textContent=pct+"%";document.getElementById("r-label").textContent=correct+" / "+total;document.getElementById("r-cor").textContent=correct;document.getElementById("r-wrg").textContent=wrong;document.getElementById("r-skp").textContent=skipped;document.getElementById("r-tot").textContent=total;var grade=pct>=90?"A":pct>=80?"B":pct>=70?"C":"Keep practicing";document.getElementById("r-grade").textContent=grade;}
function reviewWrong(){var missed=[];activeQuestions.forEach(function(q,i){if(answers[i]!==null&&answers[i]!==q.a)missed.push({q:q,a:answers[i],i});});if(missed.length===0){alert("Perfect!");return;}var sec=document.getElementById("review-section"),list=document.getElementById("review-list");document.getElementById("review-title").textContent="Wrong ("+missed.length+")";list.innerHTML="";missed.forEach(m=>{var div=document.createElement("div");div.className="ri";div.innerHTML=`<div class="rmeta">Q${m.i+1} • ${m.q.topic}</div><div class="rq">${m.q.q}</div><div class="ra wrong">Your: ${String.fromCharCode(65+m.a)})</div><div class="ra correct">Correct: ${String.fromCharCode(65+m.q.a)})</div><div class="re">${m.q.e}</div>`;list.appendChild(div);});sec.style.display="block";}
function showStart(){document.getElementById("view-start").style.display="block";document.getElementById("view-test").style.display="none";document.getElementById("view-results").style.display="none";document.getElementById("hint-btn").disabled=true;}
initQuiz();
</script>
</body>
</html>
