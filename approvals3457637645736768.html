<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Approvals - iPrint Keychains</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root {
    --kraft: #ECE0C8;
    --kraft-line: rgba(43,32,18,0.14);
    --ink: #2B2012;
    --ink-soft: rgba(43,32,18,0.66);
    --face: #FFFDF7;
    --common: #4C9A63;
    --rare: #3E7CB1;
    --epic: #8B5FBF;
    --gold: #C9971F;
    --danger: #C1272D;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
    font-family: 'Inter', sans-serif;
    background: var(--kraft);
    color: var(--ink);
    line-height: 1.6;
    min-height: 100vh;
}

h1, h2 { font-family: 'Anton', sans-serif; font-weight: 400; letter-spacing: 0.01em; }

.wrap { max-width: 780px; margin: 0 auto; padding: 30px 20px 80px; }

header.top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 6px;
}

header.top h1 { font-size: 1.6rem; text-transform: uppercase; }

.warning {
    background: #F8E3E1;
    border: 2.5px solid var(--danger);
    border-radius: 10px;
    padding: 10px 14px;
    font-size: 0.82rem;
    font-weight: 600;
    margin-bottom: 20px;
}

.btn {
    display: inline-block;
    text-align: center;
    text-decoration: none;
    font-family: 'Inter', sans-serif;
    font-weight: 700;
    font-size: 0.85rem;
    padding: 9px 16px;
    border-radius: 8px;
    border: 2.5px solid var(--ink);
    cursor: pointer;
    background: var(--rare);
    color: var(--face);
    box-shadow: 3px 3px 0 var(--ink);
}

.btn:hover { transform: translate(-1px,-1px); box-shadow: 4px 4px 0 var(--ink); }
.btn:active { transform: translate(1px,1px); box-shadow: 1px 1px 0 var(--ink); }
.btn-danger { background: var(--danger); }

.status-msg {
    font-size: 0.85rem;
    color: var(--ink-soft);
    margin-bottom: 16px;
}

.status-msg.error { color: var(--danger); font-weight: 600; }

.filter-row {
    display: flex;
    gap: 8px;
    margin-bottom: 18px;
    flex-wrap: wrap;
}

.filter-btn {
    background: var(--face);
    border: 2.5px solid var(--ink);
    border-radius: 8px;
    padding: 7px 14px;
    font-family: 'Inter', sans-serif;
    font-weight: 700;
    font-size: 0.8rem;
    cursor: pointer;
    color: var(--ink);
}

.filter-btn.active { background: var(--rare); color: var(--face); }

.view-btn {
    background: var(--face);
    border: 2.5px solid var(--ink);
    border-radius: 8px;
    padding: 8px 16px;
    font-family: 'Inter', sans-serif;
    font-weight: 700;
    font-size: 0.85rem;
    cursor: pointer;
    color: var(--ink);
}

.view-btn.active { background: var(--epic); color: var(--face); }

.log-row {
    border: 2px solid var(--ink);
    border-radius: 10px;
    padding: 12px 14px;
    margin-bottom: 10px;
    background: var(--face);
    font-size: 0.85rem;
}

.log-row .log-top {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 4px;
}

.log-row .log-actor { font-weight: 700; }
.log-row .log-time { color: var(--ink-soft); font-size: 0.78rem; }
.log-row .log-action { color: var(--ink); }
.log-row .log-details { color: var(--ink-soft); font-size: 0.8rem; margin-top: 4px; }

.review-row {
    border: 2.5px solid var(--ink);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 14px;
    background: var(--face);
    box-shadow: 3px 3px 0 rgba(43,32,18,0.2);
}

.review-row .top-line {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 12px;
    margin-bottom: 8px;
}

.review-row .meta { font-size: 0.8rem; color: var(--ink-soft); }
.review-row .stars { color: var(--gold); font-size: 1rem; }
.review-row .text { font-size: 0.92rem; margin-bottom: 10px; }

.approved-tag {
    font-size: 0.72rem;
    font-weight: 700;
    padding: 3px 8px;
    border-radius: 6px;
    border: 2px solid var(--ink);
    white-space: nowrap;
}
.approved-tag.yes { background: var(--common); color: var(--face); }
.approved-tag.no { background: var(--kraft); }

.top-line-tags {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 6px;
}

.pinned-tag {
    font-size: 0.72rem;
    font-weight: 700;
    padding: 3px 8px;
    border-radius: 6px;
    border: 2px solid var(--ink);
    background: var(--gold);
    color: var(--ink);
    white-space: nowrap;
}

.review-row .row-actions {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-top: 10px;
}

.review-row textarea {
    width: 100%;
    min-height: 56px;
    padding: 8px 10px;
    border: 2px solid var(--ink);
    border-radius: 8px;
    font-family: 'Inter', sans-serif;
    font-size: 0.85rem;
    background: var(--kraft);
    margin-top: 8px;
    resize: vertical;
}

.empty-msg {
    border: 3px dashed var(--kraft-line);
    border-radius: 14px;
    padding: 34px 20px;
    text-align: center;
    color: var(--ink-soft);
}

/* ---------- Lock screen ---------- */
#lock-screen {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.lock-card {
    background: var(--face);
    border: 4px solid var(--ink);
    border-radius: 16px;
    box-shadow: 4px 4px 0 rgba(43,32,18,0.3);
    padding: 34px;
    max-width: 360px;
    width: 100%;
    text-align: center;
}

.lock-card h1 { font-size: 1.5rem; text-transform: uppercase; margin-bottom: 6px; }
.lock-card p { color: var(--ink-soft); font-size: 0.85rem; margin-bottom: 20px; }

.lock-card input {
    width: 100%;
    padding: 11px 13px;
    border: 2.5px solid var(--ink);
    border-radius: 8px;
    font-size: 0.95rem;
    margin-bottom: 14px;
    background: var(--kraft);
    color: var(--ink);
}

.account-row {
    display: flex;
    gap: 8px;
    margin-bottom: 14px;
}

.account-btn {
    flex: 1;
    padding: 10px 8px;
    border: 2.5px solid var(--ink);
    border-radius: 8px;
    background: var(--kraft);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    font-weight: 700;
    font-size: 0.82rem;
    cursor: pointer;
}

.account-btn.active { background: var(--rare); color: var(--face); }

.lock-error {
    display: none;
    background: #F8E3E1;
    border: 2px solid var(--ink);
    border-radius: 8px;
    padding: 8px 12px;
    font-size: 0.82rem;
    margin-bottom: 12px;
}

#dashboard { display: none; }
</style>
</head>
<body>

<div id="lock-screen">
    <div class="lock-card">
        <h1>Approvals</h1>
        <p>Choose an account and enter its password.</p>
        <div class="account-row" id="account-row"></div>
        <div class="lock-error" id="lock-error">Wrong password.</div>
        <input type="password" id="lock-input" placeholder="Password" autocomplete="off">
        <button class="btn" id="unlock-btn" style="width:100%;">Unlock</button>
    </div>
</div>

<div id="dashboard">
<div class="wrap">
    <header class="top">
        <h1>Testimonial Approvals</h1>
        <button class="btn" id="reload-btn">Reload</button>
    </header>

    <div class="warning">Account passwords live in this page's own code, not on the server. Anyone who can view this file's source can read them. Keep this link private, this is a temporary setup.</div>

    <div class="filter-row" id="view-row" style="display:none;">
        <button class="view-btn active" data-view="reviews">Reviews</button>
        <button class="view-btn" data-view="logs">Activity Log</button>
    </div>

    <div id="reviews-view">
        <div class="status-msg" id="status">Loading...</div>

        <div class="filter-row">
            <button class="filter-btn active" data-filter="all">All</button>
            <button class="filter-btn" data-filter="pending">Pending only</button>
            <button class="filter-btn" data-filter="approved">Approved only</button>
        </div>

        <div id="reviews-list"></div>
    </div>

    <div id="logs-view" style="display:none;">
        <div class="status-msg" id="log-status">Loading...</div>
        <div id="logs-list"></div>
    </div>
</div>
</div>

<script>
const TESTIMONIALS_URL = "https://script.google.com/macros/s/AKfycbzcoHwy3Hj8aDUB7fNRD3Ro_3k2GPXAtbTHmx2DZAWxzPFkyfOkw9f8TvYeLgN5TG24Cw/exec";

// Separate, standalone Apps Script whose only job is logging activity.
// Paste in its /exec URL once you've deployed LoggerCode.gs.
const LOG_URL = "https://script.google.com/macros/s/AKfycbwxNBr-qz2QXI4VrwMJCGAKLmlkVNI3ai3iUEGbarkh4rWsrq9Aa66ZSrkpmYrdlAKZOA/exec";

// ---- Temporary client-side accounts ----
// These checks happen entirely in the browser. Anyone who views this
// page's source can read every password and role restriction below
// directly, so this only stops casual/accidental access, not someone
// who actually looks. Meant to be replaced with real protection later.
const ACCOUNTS = [
  {
    id: "owner",
    label: "Owner",
    password: "Archie is the best dog and that is true",
    role: "owner" // full access: approve, reply, pin, delete
  },
  {
    id: "manager",
    label: "Testimonials Manager",
    password: "93560",
    role: "manager" // can only approve / set pending
  }
];

let selectedAccountId = ACCOUNTS[0].id;
let currentRole = null;
let currentActorLabel = null;

const lockScreen = document.getElementById("lock-screen");
const dashboard = document.getElementById("dashboard");
const lockInput = document.getElementById("lock-input");
const lockError = document.getElementById("lock-error");
const accountRow = document.getElementById("account-row");

accountRow.innerHTML = ACCOUNTS.map(acc =>
  `<button type="button" class="account-btn${acc.id === selectedAccountId ? ' active' : ''}" data-account="${acc.id}">${acc.label}</button>`
).join("");

accountRow.querySelectorAll(".account-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    selectedAccountId = btn.dataset.account;
    accountRow.querySelectorAll(".account-btn").forEach(b => b.classList.toggle("active", b === btn));
    lockError.style.display = "none";
    lockInput.value = "";
    lockInput.focus();
  });
});

function unlock() {
  const account = ACCOUNTS.find(a => a.id === selectedAccountId);
  if (account && lockInput.value === account.password) {
    currentRole = account.role;
    currentActorLabel = account.label;
    lockError.style.display = "none";
    lockScreen.style.display = "none";
    dashboard.style.display = "block";
    document.getElementById("view-row").style.display = currentRole === "owner" ? "flex" : "none";
    load();
  } else {
    lockError.style.display = "block";
  }
}

document.getElementById("unlock-btn").addEventListener("click", unlock);
lockInput.addEventListener("keydown", e => { if (e.key === "Enter") unlock(); });

// ---- View switcher (Reviews / Activity Log), owner only ----
document.querySelectorAll(".view-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".view-btn").forEach(b => b.classList.toggle("active", b === btn));
    const view = btn.dataset.view;
    document.getElementById("reviews-view").style.display = view === "reviews" ? "block" : "none";
    document.getElementById("logs-view").style.display = view === "logs" ? "block" : "none";
    if (view === "logs") loadLogs();
  });
});

function loadLogs() {
  const logStatus = document.getElementById("log-status");
  const logsList = document.getElementById("logs-list");

  if (!LOG_URL || LOG_URL.indexOf("PASTE_YOUR") === 0) {
    logStatus.textContent = "Logging script isn't configured yet (LOG_URL is still a placeholder).";
    logsList.innerHTML = "";
    return;
  }

  logStatus.textContent = "Loading...";

  fetch(LOG_URL)
    .then(res => res.json())
    .then(data => {
      if (!data.success) {
        logStatus.textContent = "Error: " + data.error;
        return;
      }
      if (!data.entries.length) {
        logStatus.textContent = "No activity logged yet.";
        logsList.innerHTML = "";
        return;
      }
      logStatus.textContent = data.entries.length + " entr" + (data.entries.length === 1 ? "y" : "ies") + ".";
      logsList.innerHTML = data.entries.map(entry => `
        <div class="log-row">
          <div class="log-top">
            <span class="log-actor">${escapeHtml(entry.actor)}</span>
            <span class="log-time">${escapeHtml(entry.timestamp)}</span>
          </div>
          <div class="log-action">${escapeHtml(entry.action)}${entry.reviewId ? " &middot; review " + escapeHtml(entry.reviewId) : ""}</div>
          ${entry.details ? `<div class="log-details">${escapeHtml(entry.details)}</div>` : ""}
        </div>
      `).join("");
    })
    .catch(() => {
      logStatus.textContent = "Couldn't reach the script.";
    });
}

let allReviews = [];
let currentFilter = "all";

const listEl = document.getElementById("reviews-list");
const statusEl = document.getElementById("status");

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str == null ? "" : String(str);
  return div.innerHTML;
}

function starsHtml(n) {
  return "★".repeat(n) + "☆".repeat(5 - n);
}

function applyFilter(reviews) {
  if (currentFilter === "pending") return reviews.filter(r => !r.approved);
  if (currentFilter === "approved") return reviews.filter(r => r.approved);
  return reviews;
}

function render() {
  const reviews = applyFilter(allReviews);

  if (!reviews.length) {
    listEl.innerHTML = '<div class="empty-msg">Nothing to show for this filter.</div>';
    return;
  }

  const isOwner = currentRole === "owner";

  listEl.innerHTML = reviews.map(r => `
    <div class="review-row" data-id="${r.id}">
      <div class="top-line">
        <div>
          <div class="stars">${starsHtml(r.rating)}</div>
          <div class="meta">${r.anonymous ? "Anonymous" : escapeHtml(r.name)} &middot; ${escapeHtml(r.timestamp)}</div>
        </div>
        <div class="top-line-tags">
          <span class="approved-tag ${r.approved ? "yes" : "no"}">${r.approved ? "APPROVED" : "PENDING"}</span>
          ${r.pinned ? '<span class="pinned-tag">📌 PINNED</span>' : ''}
        </div>
      </div>
      <div class="text">${r.review === "Left Blank" ? "<em>No written comment.</em>" : escapeHtml(r.review)}</div>
      ${isOwner
        ? `<textarea class="reply-input" placeholder="Reply shown under this review...">${escapeHtml(r.reply || "")}</textarea>`
        : (r.reply ? `<div class="text"><strong>Reply:</strong> ${escapeHtml(r.reply)}</div>` : '')
      }
      <div class="row-actions">
        <button class="btn toggle-btn">${r.approved ? "Set Pending" : "Approve"}</button>
        ${isOwner ? `<button class="btn pin-btn">${r.pinned ? "Unpin" : "Pin"}</button>` : ''}
        ${isOwner ? `<button class="btn save-reply-btn">Save Reply</button>` : ''}
        ${isOwner ? `<button class="btn btn-danger delete-btn">Delete</button>` : ''}
      </div>
    </div>
  `).join("");

  listEl.querySelectorAll(".review-row").forEach(row => {
    const id = row.dataset.id;
    const review = allReviews.find(r => r.id === id);

    row.querySelector(".toggle-btn").addEventListener("click", () => {
      const newApproved = !review.approved;
      apiCall({ action: "admin_approve", id, approved: newApproved }).then(res => {
        if (res.success) {
          review.approved = newApproved;
          render();
          logAction(newApproved ? "Approved" : "Set Pending", id, "");
        } else {
          alert("Couldn't update: " + res.error);
        }
      });
    });

    const pinBtn = row.querySelector(".pin-btn");
    if (pinBtn) {
      pinBtn.addEventListener("click", () => {
        const newPinned = !review.pinned;
        apiCall({ action: "admin_pin", id, pinned: newPinned }).then(res => {
          if (res.success) {
            review.pinned = newPinned;
            render();
            logAction(newPinned ? "Pinned" : "Unpinned", id, "");
          } else {
            alert("Couldn't update: " + res.error);
          }
        });
      });
    }

    const saveReplyBtn = row.querySelector(".save-reply-btn");
    if (saveReplyBtn) {
      saveReplyBtn.addEventListener("click", () => {
        const reply = row.querySelector(".reply-input").value;
        apiCall({ action: "admin_reply", id, reply }).then(res => {
          if (res.success) {
            review.reply = reply;
            alert("Reply saved.");
            logAction("Replied", id, reply.slice(0, 200));
          } else {
            alert("Couldn't save: " + res.error);
          }
        });
      });
    }

    const deleteBtn = row.querySelector(".delete-btn");
    if (deleteBtn) {
      deleteBtn.addEventListener("click", () => {
        if (!confirm("Delete this review permanently? This can't be undone.")) return;
        apiCall({ action: "admin_delete", id }).then(res => {
          if (res.success) {
            allReviews = allReviews.filter(r => r.id !== id);
            render();
            logAction("Deleted", id, "");
          } else {
            alert("Couldn't delete: " + res.error);
          }
        });
      });
    }
  });
}

function apiCall(payload) {
  return fetch(TESTIMONIALS_URL, { method: "POST", body: JSON.stringify(payload) })
    .then(res => res.json())
    .catch(() => ({ success: false, error: "Network error." }));
}

function logAction(action, reviewId, details) {
  if (!LOG_URL || LOG_URL.indexOf("PASTE_YOUR") === 0) return; // not configured yet
  fetch(LOG_URL, {
    method: "POST",
    body: JSON.stringify({ actor: currentActorLabel, action, reviewId, details: details || "" })
  })
    .then(res => res.json())
    .then(res => {
      if (!res.success) {
        alert("Action succeeded, but the log entry failed: " + res.error);
      }
    })
    .catch(() => {
      alert("Action succeeded, but couldn't reach the logging script.");
    });
}

function load() {
  statusEl.textContent = "Loading...";
  statusEl.classList.remove("error");

  fetch(TESTIMONIALS_URL + "?action=admin_list")
    .then(res => res.json())
    .then(data => {
      if (data.success) {
        allReviews = data.reviews;
        statusEl.textContent = allReviews.length + " review(s) total, " +
          allReviews.filter(r => !r.approved).length + " pending.";
        render();
      } else {
        statusEl.textContent = "Error: " + data.error;
        statusEl.classList.add("error");
      }
    })
    .catch(() => {
      statusEl.textContent = "Couldn't reach the testimonials script.";
      statusEl.classList.add("error");
    });
}

document.getElementById("reload-btn").addEventListener("click", load);

document.querySelectorAll(".filter-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    currentFilter = btn.dataset.filter;
    render();
  });
});
</script>

</body>
</html>
