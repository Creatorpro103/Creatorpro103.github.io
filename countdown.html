<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Saira+Stencil&display=swap" rel="stylesheet">
<title>Last Day Countdown</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: 'Saira Stencil', sans-serif;
  overflow: hidden;
  min-height: 100vh;
}

/* Animated background */
.background {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: linear-gradient(-45deg, #ff6b6b, #ffd93d, #6bcf7f, #4ecdc4);
  background-size: 400% 400%;
  animation: gradient 15s ease infinite;
  z-index: -2;
}

@keyframes gradient {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

/* Floating shapes */
.shape {
  position: absolute;
  opacity: 0.15;
  animation: float 6s ease-in-out infinite;
  z-index: -1;
}

.shape-1 {
  width: 200px;
  height: 200px;
  background: white;
  border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%;
  top: 10%;
  left: 5%;
  animation: float 8s ease-in-out infinite;
}

.shape-2 {
  width: 150px;
  height: 150px;
  background: white;
  border-radius: 60% 40% 30% 70% / 60% 30% 70% 40%;
  top: 60%;
  right: 10%;
  animation: float 10s ease-in-out infinite reverse;
}

.shape-3 {
  width: 180px;
  height: 180px;
  background: white;
  border-radius: 30% 70% 70% 30% / 30% 30% 70% 70%;
  top: 30%;
  right: 15%;
  animation: float 12s ease-in-out infinite;
}

@keyframes float {
  0%, 100% { transform: translateY(0px) rotate(0deg); }
  50% { transform: translateY(-30px) rotate(180deg); }
}

/* Particles */
.particle {
  position: fixed;
  pointer-events: none;
  animation: particle-fall 3s ease-out forwards;
  z-index: 1;
}

@keyframes particle-fall {
  to {
    transform: translateY(100vh) rotate(360deg);
    opacity: 0;
  }
}

/* Main container */
.container {
  position: relative;
  z-index: 10;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  flex-direction: column;
  padding: 2rem;
}

/* Title */
.title {
  font-size: clamp(2rem, 8vw, 4rem);
  font-weight: 700;
  margin-bottom: 1.5rem;
  color: white;
  text-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
  animation: slideDown 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
  letter-spacing: 2px;
}

@keyframes slideDown {
  from {
    opacity: 0;
    transform: translateY(-50px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* Emoji animation */
.emoji {
  font-size: clamp(2rem, 15vw, 5rem);
  animation: bounce-emoji 1.2s ease-in-out infinite, rotate-emoji 3s linear infinite;
  margin-bottom: 1rem;
}

@keyframes bounce-emoji {
  0%, 100% { transform: translateY(0) scaleY(1); }
  50% { transform: translateY(-40px) scaleY(1.1); }
}

@keyframes rotate-emoji {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}

/* Countdown box */
.countdown-box {
  background: rgba(255, 255, 255, 0.95);
  backdrop-filter: blur(10px);
  border-radius: 30px;
  padding: 3rem 2rem;
  box-shadow: 
    0 20px 60px rgba(0, 0, 0, 0.3),
    0 0 0 1px rgba(255, 255, 255, 0.5) inset;
  animation: popIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) 0.2s both;
  max-width: 600px;
  width: 100%;
  position: relative;
  overflow: hidden;
}

.countdown-box::before {
  content: '';
  position: absolute;
  top: -50%;
  left: -50%;
  width: 200%;
  height: 200%;
  background: linear-gradient(
    45deg,
    transparent 30%,
    rgba(255, 255, 255, 0.3) 50%,
    transparent 70%
  );
  animation: shimmer 3s infinite;
}

@keyframes shimmer {
  0% { transform: translateX(-100%) translateY(-100%); }
  100% { transform: translateX(100%) translateY(100%); }
}

@keyframes popIn {
  from {
    opacity: 0;
    transform: scale(0.5);
  }
  to {
    opacity: 1;
    transform: scale(1);
  }
}

/* Time units grid */
.time-units {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(80px, 1fr));
  gap: 1rem;
  margin: 2rem 0;
  position: relative;
  z-index: 1;
}

.unit {
  background: #ff6b6b;
  border-radius: 20px;
  padding: 1.5rem 1rem;
  text-align: center;
  color: white;
  box-shadow: 0 10px 30px rgba(255, 107, 107, 0.3);
  transition: all 0.3s ease;
  position: relative;
  overflow: hidden;
  cursor: pointer;
}

.unit:nth-child(2) {
  background: #ffd93d;
  box-shadow: 0 10px 30px rgba(255, 217, 61, 0.3);
}

.unit:nth-child(3) {
  background: #6bcf7f;
  box-shadow: 0 10px 30px rgba(107, 207, 127, 0.3);
}

.unit:nth-child(4) {
  background: #4ecdc4;
  box-shadow: 0 10px 30px rgba(78, 205, 196, 0.3);
}



.unit:hover {
  transform: translateY(-15px) scale(1.1);
  box-shadow: 0 20px 50px rgba(0, 0, 0, 0.2);
}

.unit-number {
  font-size: clamp(1.5rem, 5vw, 2.5rem);
  font-weight: 800;
  line-height: 1;
  position: relative;
  z-index: 1;
}

.unit-label {
  font-size: 0.85rem;
  margin-top: 0.5rem;
  text-transform: uppercase;
  letter-spacing: 1.5px;
  font-weight: 600;
  position: relative;
  z-index: 1;
  opacity: 0.95;
}

/* Subtitle */
.subtitle {
  font-size: 1.3rem;
  color: white;
  margin-top: 2rem;
  text-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
  animation: fadeIn 1s ease-out 0.5s both;
  font-weight: 500;
}

@keyframes fadeIn {
  from {
    opacity: 0;
  }
  to {
    opacity: 1;
  }
}

/* Finished state */
.finished {
  animation: pulse-finished 0.5s ease-out;
}

@keyframes pulse-finished {
  0% { transform: scale(1); }
  50% { transform: scale(1.1); }
  100% { transform: scale(1); }
}

/* Glitch effect */
.glitch {
  animation: glitch 0.3s ease-out;
}

@keyframes glitch {
  0%, 100% { transform: translate(0); }
  20% { transform: translate(-2px, 2px); }
  40% { transform: translate(-2px, -2px); }
  60% { transform: translate(2px, 2px); }
  80% { transform: translate(2px, -2px); }
}

/* Celebration text */
.celebration {
  position: absolute;
  font-size: 2rem;
  color: white;
  font-weight: bold;
  text-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
  animation: celebration-float 2s ease-out forwards;
  pointer-events: none;
}

@keyframes celebration-float {
  0% {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
  100% {
    opacity: 0;
    transform: translateY(-100px) scale(0.5);
  }
}

/* Beat vibration effect */
.beat-vibrate {
  animation: beat-pulse 0.1s cubic-bezier(0.36, 0, 0.66, -0.56) infinite;
}

@keyframes beat-pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.05); }
}

/* Screen shake on finish */
.screen-shake {
  animation: shake 0.15s cubic-bezier(0.36, 0, 0.66, -0.56) infinite;
}

@keyframes shake {
  0%, 100% { transform: translateX(0) translateY(0); }
  10% { transform: translateX(-5px) translateY(-5px); }
  20% { transform: translateX(5px) translateY(5px); }
  30% { transform: translateX(-5px) translateY(5px); }
  40% { transform: translateX(5px) translateY(-5px); }
  50% { transform: translateX(-5px) translateY(-5px); }
  60% { transform: translateX(5px) translateY(5px); }
  70% { transform: translateX(-5px) translateY(5px); }
  80% { transform: translateX(5px) translateY(-5px); }
  90% { transform: translateX(-5px) translateY(0); }
}

/* Rapid flash effect */
.flash-effect {
  animation: flash-screen 0.1s ease-in-out;
}

@keyframes flash-screen {
  0%, 100% { background-color: transparent; }
  50% { background-color: rgba(255, 255, 255, 0.8); }
}

/* Hype text flying in */
.hype-text {
  position: fixed;
  font-size: 3rem;
  font-weight: bold;
  color: white;
  text-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
  animation: hype-fly 1.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
  pointer-events: none;
  font-family: 'Saira Stencil', sans-serif;
  z-index: 100;
}

@keyframes hype-fly {
  0% {
    opacity: 1;
    transform: translate(-50%, -50%) scale(0.5) rotate(-20deg);
  }
  100% {
    opacity: 0;
    transform: translate(-50%, -50%) scale(2) rotate(20deg);
  }
}

/* Confetti burst */
.confetti-burst {
  position: fixed;
  font-size: 2rem;
  animation: confetti-explode 2s ease-out forwards;
  pointer-events: none;
  z-index: 50;
}

@keyframes confetti-explode {
  0% {
    opacity: 1;
    transform: translate(0, 0) scale(1);
  }
  100% {
    opacity: 0;
    transform: translate(var(--tx), var(--ty)) scale(0);
  }
}
</style>
</head>
<body>

<div class="background"></div>
<div class="shape shape-1"></div>
<div class="shape shape-2"></div>
<div class="shape shape-3"></div>

<div class="container">
  <div class="title">Last Day Countdown</div>
  <div class="emoji" id="emoji">🎉</div>
  
  <div class="countdown-box" id="countdownBox">
    <div class="time-units" id="countdown">
      <div class="unit">
        <div class="unit-number" id="days">00</div>
        <div class="unit-label">Days</div>
      </div>
      <div class="unit">
        <div class="unit-number" id="hours">00</div>
        <div class="unit-label">Hours</div>
      </div>
      <div class="unit">
        <div class="unit-number" id="minutes">00</div>
        <div class="unit-label">Minutes</div>
      </div>
      <div class="unit">
        <div class="unit-number" id="seconds">00</div>
        <div class="unit-label">Seconds</div>
      </div>
    </div>
    <div class="subtitle" id="message">Until the last day of school!</div>
  </div>
</div>

<script>
const targetDate = new Date("May 21, 2026 11:30:00").getTime();
const emojis = ['🎉', '📝',  '🏫', '📚', '🎓', '🚀', '🎯'];
const particles = ['🎉', '🎊', '✨', '⭐', '💫', '🎈', '🎓'];
let lastSecond = -1;
let celebrationStarted = false;
let countdownFinished = false;

// Audio setup
const bg1 = new Audio('bg1.mp3');
const bg2 = new Audio('bg2.mp3');
const celebrationAudio = new Audio('celebration.mp3');

bg1.addEventListener('ended', () => {
  bg2.play();
});

bg2.addEventListener('ended', () => {
  bg1.play();
});

// Start playing background music
bg1.play().catch(err => console.log('Audio play failed:', err));

function createParticle() {
  const particle = document.createElement('div');
  particle.classList.add('particle');
  particle.textContent = particles[Math.floor(Math.random() * particles.length)];
  particle.style.left = Math.random() * 100 + '%';
  particle.style.top = '-20px';
  particle.style.fontSize = Math.random() * 20 + 20 + 'px';
  particle.style.opacity = Math.random() * 0.5 + 0.5;
  document.body.appendChild(particle);
  
  setTimeout(() => particle.remove(), 3000);
}

function createCelebrationText() {
  const celebrations = ['YES!', 'FINALLY!', 'YESSSSS!', 'WOOHOO!', 'LET\'S GO!', 'FREEDOM!'];
  const celebration = document.createElement('div');
  celebration.classList.add('celebration');
  celebration.textContent = celebrations[Math.floor(Math.random() * celebrations.length)];
  celebration.style.left = Math.random() * 80 + 10 + '%';
  celebration.style.top = Math.random() * 50 + '%';
  document.body.appendChild(celebration);
  
  setTimeout(() => celebration.remove(), 2000);
}

function createHypeText() {
  const hypeMessages = ['LETS GO!', 'HYPED!', 'YES!', 'YEAH!', 'WOAH!', 'SICK!'];
  const hypeText = document.createElement('div');
  hypeText.classList.add('hype-text');
  hypeText.textContent = hypeMessages[Math.floor(Math.random() * hypeMessages.length)];
  hypeText.style.left = Math.random() * 100 + '%';
  hypeText.style.top = Math.random() * 100 + '%';
  document.body.appendChild(hypeText);
  
  setTimeout(() => hypeText.remove(), 1500);
}

function createConfettiBurst() {
  const confettiEmojis = ['🎉', '🎊', '✨', '⭐', '💫', '🎈', '🎓'];
  for (let i = 0; i < 12; i++) {
    const confetti = document.createElement('div');
    confetti.classList.add('confetti-burst');
    confetti.textContent = confettiEmojis[Math.floor(Math.random() * confettiEmojis.length)];
    
    const angle = (Math.PI * 2 * i) / 12;
    const velocity = 300 + Math.random() * 200;
    const tx = Math.cos(angle) * velocity;
    const ty = Math.sin(angle) * velocity;
    
    confetti.style.left = '50%';
    confetti.style.top = '50%';
    confetti.style.setProperty('--tx', tx + 'px');
    confetti.style.setProperty('--ty', ty + 'px');
    confetti.style.fontSize = (Math.random() * 20 + 20) + 'px';
    
    document.body.appendChild(confetti);
    setTimeout(() => confetti.remove(), 2000);
  }
}

function updateCountdown() {
  const now = new Date().getTime();
  const distance = targetDate - now;

  // Start celebration 15 seconds before countdown finishes
  if (distance > 0 && distance < 15000 && !celebrationStarted) {
    celebrationStarted = true;
    bg1.pause();
    bg2.pause();
    celebrationAudio.play().catch(err => console.log('Celebration audio failed:', err));
    
    // Start hype effects
    const hypeInterval = setInterval(() => {
      if (countdownFinished) {
        clearInterval(hypeInterval);
        return;
      }
      createHypeText();
      createConfettiBurst();
      createParticle();
    }, 200);
  }

  if (distance < 0) {
    countdownFinished = true;
    document.getElementById('days').textContent = '00';
    document.getElementById('hours').textContent = '00';
    document.getElementById('minutes').textContent = '00';
    document.getElementById('seconds').textContent = '00';
    document.getElementById('message').textContent = '🎓 YOU MADE IT! FREEDOM! 🎓';
    document.querySelector('.title').textContent = 'FREEDOM!';
    
    // Add beat vibration effect
    const countdownBox = document.getElementById('countdownBox');
    countdownBox.classList.add('finished', 'beat-vibrate');
    
    // Add screen shake effect
    document.body.classList.add('screen-shake');
    
    // Massive celebration burst
    for (let i = 0; i < 50; i++) {
      setTimeout(() => {
        createParticle();
        createConfettiBurst();
      }, i * 30);
    }
    
    for (let i = 0; i < 30; i++) {
      setTimeout(createCelebrationText, i * 80);
    }
    
    for (let i = 0; i < 50; i++) {
      setTimeout(() => {
        createHypeText();
      }, i * 100);
    }
    
    return;
  }

  const days = Math.floor(distance / (1000 * 60 * 60 * 24));
  const hours = Math.floor((distance / (1000 * 60 * 60)) % 24);
  const minutes = Math.floor((distance / (1000 * 60)) % 60);
  const seconds = Math.floor((distance / 1000) % 60);

  document.getElementById('days').textContent = String(days).padStart(2, '0');
  document.getElementById('hours').textContent = String(hours).padStart(2, '0');
  document.getElementById('minutes').textContent = String(minutes).padStart(2, '0');
  document.getElementById('seconds').textContent = String(seconds).padStart(2, '0');

  // Change emoji randomly
  if (Math.random() > 0.95) {
    const emojiEl = document.getElementById('emoji');
    emojiEl.textContent = emojis[Math.floor(Math.random() * emojis.length)];
    emojiEl.classList.add('glitch');
    setTimeout(() => emojiEl.classList.remove('glitch'), 300);
  }

  // Add glitch effect every second
  if (seconds !== lastSecond) {
    lastSecond = seconds;
    const units = document.querySelectorAll('.unit-number');
    units.forEach(unit => {
      unit.classList.add('glitch');
      setTimeout(() => unit.classList.remove('glitch'), 300);
    });
  }

  // Randomly spawn particles
  if (Math.random() > 0.92) {
    createParticle();
  }
}

// Initial update
updateCountdown();

// Update every 100ms for smooth animation
setInterval(updateCountdown, 100);

// Larger particle bursts occasionally
setInterval(() => {
  if (Math.random() > 0.7) {
    for (let i = 0; i < 3; i++) {
      setTimeout(createParticle, i * 50);
    }
  }
}, 2000);
</script>

</body>
</html>
