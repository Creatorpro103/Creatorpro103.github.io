<!DOCTYPE html>

<style>
:root {
    --kraft: #ECE0C8;
    --kraft-line: rgba(43,32,18,0.14);
    --ink: #2B2012;
    --ink-soft: rgba(43,32,18,0.66);
    --face: #FFFDF7;
    --common: #4C9A63;
    --rare: #3E7CB1;
    --epic: #8B5FBF;
    --gold: #C9971F;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
    font-family: 'Inter', sans-serif;
    background: var(--kraft);
    color: var(--ink);
    line-height: 1.6;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
}

h1, h2 { font-family: 'Anton', sans-serif; font-weight: 400; letter-spacing: 0.01em; }
a { color: inherit; }

nav.top {
    display: flex;
    align-items: center;
    max-width: 1120px;
    margin: 0 auto;
    padding: 26px 24px;
    width: 100%;
}

.wordmark { display: flex; align-items: center; gap: 10px; font-size: 1.2rem; }

.logo-dot {
    width: 20px;
    height: 26px;
    border-radius: 4px;
    background: var(--rare);
    border: 2.5px solid var(--ink);
}

main {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px 24px 60px;
}

.wrap {
    max-width: 480px;
    text-align: center;
}

.charm {
    width: 92px;
    margin: 0 auto 28px;
    transform-origin: 50% 10px;
    animation: swing 3.6s ease-in-out infinite;
}

@keyframes swing {
    0%, 100% { transform: rotate(6deg); }
    50% { transform: rotate(-6deg); }
}

.code {
    font-size: clamp(3.5rem, 12vw, 5rem);
    text-transform: uppercase;
    color: var(--ink);
    line-height: 1;
    margin-bottom: 6px;
}

.code .accent { color: var(--rare); }

h2 {
    font-size: 1.4rem;
    text-transform: uppercase;
    margin: 10px 0 12px;
}

.blame {
    color: var(--ink-soft);
    font-size: 0.98rem;
    max-width: 38ch;
    margin: 0 auto 32px;
}

.actions {
    display: flex;
    gap: 12px;
    justify-content: center;
    flex-wrap: wrap;
}

.btn {
    display: inline-block;
    text-decoration: none;
    font-weight: 700;
    font-size: 0.95rem;
    padding: 13px 26px;
    border-radius: 10px;
    border: 2.5px solid var(--ink);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
}

.btn-primary {
    background: var(--rare);
    color: var(--face);
    box-shadow: 4px 4px 0 var(--ink);
}
.btn-primary:hover { transform: translate(-2px,-2px); box-shadow: 6px 6px 0 var(--ink); }

.btn-light {
    background: var(--face);
    color: var(--ink);
    box-shadow: 4px 4px 0 rgba(43,32,18,0.5);
}
.btn-light:hover { transform: translate(-2px,-2px); box-shadow: 6px 6px 0 rgba(43,32,18,0.5); }

footer {
    border-top: 3px solid var(--ink);
    padding: 26px 24px 34px;
    text-align: center;
    font-size: 0.85rem;
    color: var(--ink-soft);
}

@media (prefers-reduced-motion: reduce) {
    .charm { animation: none; }
    .btn { transition: none; }
}
</style>
</head>

        </svg>
