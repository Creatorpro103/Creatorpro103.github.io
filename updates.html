<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Update Log - iPrint Keychains</title>
<meta name="description" content="What's new at iPrint Keychains. New products, site changes, and updates as they happen.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root {
    --kraft: #ECE0C8;
    --kraft-line: rgba(43,32,18,0.14);
    --ink: #2B2012;
    --ink-soft: rgba(43,32,18,0.66);
    --face: #FFFDF7;
    --rare: #3E7CB1;
    --gold: #C9971F;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
    font-family: 'Inter', sans-serif;
    background: var(--kraft);
    color: var(--ink);
    line-height: 1.6;
    min-height: 100vh;
}

h1, h2 { font-family: 'Anton', sans-serif; font-weight: 400; letter-spacing: 0.01em; }
a { color: inherit; }

nav.top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    max-width: 760px;
    margin: 0 auto;
    padding: 26px 24px;
}

.wordmark { display: flex; align-items: center; gap: 10px; font-size: 1.2rem; }
.logo-dot { width: 20px; height: 26px; border-radius: 4px; background: var(--rare); border: 2.5px solid var(--ink); }

.navlink { text-decoration: none; font-weight: 600; font-size: 0.95rem; border-bottom: 2px solid transparent; }
.navlink:hover { border-color: var(--ink); }

.wrap { max-width: 760px; margin: 0 auto; padding: 10px 24px 60px; }

header.hero {
    padding: 10px 0 40px;
    border-bottom: 2px solid var(--ink);
    margin-bottom: 36px;
}

header.hero h1 { font-size: clamp(2rem, 5vw, 2.8rem); text-transform: uppercase; }
header.hero p { color: var(--ink-soft); margin-top: 10px; max-width: 52ch; }

.status-msg { color: var(--ink-soft); font-size: 0.9rem; }

.timeline {
    display: flex;
    flex-direction: column;
    gap: 22px;
}

.entry {
    background: var(--face);
    border: 1px solid var(--kraft-line);
    border-radius: 14px;
    padding: 20px 22px;
    position: relative;
}

.entry .date {
    display: inline-block;
    background: var(--gold);
    color: var(--ink);
    font-weight: 700;
    font-size: 0.78rem;
    padding: 4px 10px;
    border-radius: 6px;
    border: 2px solid var(--ink);
    margin-bottom: 10px;
}

.entry h2 { font-size: 1.05rem; margin-bottom: 8px; text-transform: none; }

.entry p {
    color: var(--ink-soft);
    font-size: 0.92rem;
    white-space: normal;
    margin: 0 0 14px;
}

.entry p:last-child {
    margin-bottom: 0;
}

.entry strong {
    font-weight: 700;
}

.entry em {
    font-style: italic;
}

.entry a {
    color: inherit;
}

.empty-state {
    border: 3px dashed var(--kraft-line);
    border-radius: 16px;
    padding: 40px 24px;
    text-align: center;
    color: var(--ink-soft);
}

footer { text-align: center; padding: 30px 0; color: var(--ink-soft); font-size: 0.85rem; }
</style>
</head>
<body>

<nav class="top">
    <div class="wordmark"><span class="logo-dot"></span>iPrint Keychains</div>
    <a class="navlink" href="index.html">Back home</a>
</nav>

<div class="wrap">
    <header class="hero">
        <h1>Update Log</h1>
        <p>What's new at iPrint Keychains, new products, site changes, and updates as they happen.</p>
    </header>

    <p class="status-msg" id="status">Loading...</p>
    <div class="timeline" id="timeline"></div>
</div>

<footer>iPrint Keychains &middot; isaacneal.com</footer>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbxwg-noETLbdpQE0TXQZ-H-wvlkSZ-xDHt3h8gqyLywRopGxGZ-4kZgGVRS2Wx50GM0Tg/exec";

const statusEl = document.getElementById('status');
const timelineEl = document.getElementById('timeline');

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str == null ? '' : String(str);
  return div.innerHTML;
}

// Render Markdown formatting safely.
// Supports:
// **bold**
// *italic*
// [links](https://example.com)
// Blank lines create new paragraphs.
function renderMarkdownInline(text) {
  let safe = escapeHtml(text);

  // Links
  safe = safe.replace(
    /\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,
    '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>'
  );

  // Bold
  safe = safe.replace(
    /\*\*([^*]+)\*\*/g,
    '<strong>$1</strong>'
  );

  // Italic
  safe = safe.replace(
    /(?<!\*)\*([^*]+)\*(?!\*)/g,
    '<em>$1</em>'
  );

  // Underscore italic
  safe = safe.replace(
    /_([^_]+)_/g,
    '<em>$1</em>'
  );

  return safe;
}

function renderMarkdown(text) {
  if (text == null || text === '') return '';

  // Normalize line breaks
  const normalized = String(text)
    .replace(/\r\n/g, '\n')
    .replace(/\r/g, '\n');

  // Split into paragraphs using blank lines
  const paragraphs = normalized
    .split(/\n\s*\n/)
    .map(p => p.trim())
    .filter(Boolean);

  return paragraphs.map(paragraph => {
    const formatted = renderMarkdownInline(paragraph)
      .replace(/\n/g, '<br>');

    return '<p>' + formatted + '</p>';
  }).join('');
}

fetch(API_URL + '?action=list_updates')
  .then(res => res.json())
  .then(data => {
    if (!data.success) {
      statusEl.textContent = "Couldn't load updates right now.";
      return;
    }

    if (!data.updates.length) {
      statusEl.textContent = '';
      timelineEl.innerHTML = '<div class="empty-state">Nothing posted yet, check back soon.</div>';
      return;
    }

    statusEl.style.display = 'none';

    timelineEl.innerHTML = data.updates.map(u => `
      <div class="entry">
        <span class="date">${escapeHtml(u.date)}</span>
        <h2>${renderMarkdownInline(u.title)}</h2>
        ${u.description ? renderMarkdown(u.description) : ''}
      </div>
    `).join('');
  })
  .catch(() => {
    statusEl.textContent = "Couldn't reach the server. Try again in a bit.";
  });
</script>

</body>
</html>
